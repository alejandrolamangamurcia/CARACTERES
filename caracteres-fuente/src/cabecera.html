<div id="root"><div id="arranque">Cargando Caracteres <!--VERSION-->&hellip;</div></div>
<script>
function mostrarFallo(txt) {
  var r = document.getElementById("root");
  if (r) r.innerHTML = '<div id="fallo">La app no ha podido arrancar (<!--VERSION-->).\n\n' + txt + '\n\nCopia este texto y pegalo en el chat.</div>';
}
window.addEventListener("error", function (ev) { mostrarFallo(String(ev.message || ev.error)); });
window.addEventListener("unhandledrejection", function (ev) { mostrarFallo("Promesa: " + String(ev.reason && ev.reason.message || ev.reason)); });
setTimeout(function () {
  var a = document.getElementById("arranque");
  if (a) mostrarFallo("Se quedo cargando sin dar ningun error.");
}, 8000);
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
