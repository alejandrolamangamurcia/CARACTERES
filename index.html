laciona con facilidad.",v:["a los diez minutos en un sitio nuevo ya est\xE1 hablando con alguien.","en la cola del supermercado acaba sabiendo de d\xF3nde es el de delante.","llega sin conocer a nadie y se va con dos n\xFAmeros de tel\xE9fono."]},{p:"Expansivo",d:"se expresa con amplitud: gesticula, alza la voz, ocupa sitio.",v:["se le oye desde la otra punta del bar sin que est\xE9 gritando.","ocupa toda la mesa con los brazos al contar algo.","entra en una sala y todos notan que ha entrado."]},{p:"Efusivo",d:"expresa el afecto y el entusiasmo sin filtro ni contenci\xF3n.",v:["te abraza al saludarte aunque hay\xE1is quedado dos veces en la vida.","celebra tu ascenso como si fuera el suyo.","manda un audio de un minuto solo para decir que se ha alegrado de verte."]},{p:"Campechano",d:"trata a todo el mundo con llaneza, sin marcar rango ni distancia.",v:["tutea al jefe y al camarero exactamente igual.","se sienta con los operarios a comer en vez de con los jefes.","cuenta el mismo chiste malo a un ministro que a un vecino."]},{p:"Locuaz",d:"habla mucho y con facilidad. Neutro: describe fluidez, no exceso.",v:["le preguntas algo de s\xED o no y te da tres minutos.","cualquier tema le da para media hora de conversaci\xF3n.","nunca hay un silencio inc\xF3modo cerca de \xE9l."]},{p:"Dicharachero",d:"habla con gracia y soltura; anima la conversaci\xF3n.",v:["la mesa se r\xEDe cada vez que toma la palabra.","convierte la cola del banco en una charla con desconocidos.","tiene un comentario gracioso para cada situaci\xF3n aburrida."]},{p:"Parlanch\xEDn",d:"habla mucho, con matiz de exceso y de poco fondo.",v:["llevas veinte minutos oy\xE9ndole y no te ha preguntado nada.","te cuenta el argumento entero de la serie antes de que puedas verla.","en la reuni\xF3n, buena parte del tiempo es \xE9l hablando de lo suyo."]},{p:"Verborreico",d:"habla en avalancha, sin filtro y sin dejar hueco.",v:["haces una pregunta de treinta segundos y la respuesta dura diez minutos.","no deja hueco para que nadie m\xE1s meta una frase.","se enreda en detalles que nadie ha pedido y no encuentra el final."]},{p:"Avasallador",d:"su energ\xEDa no deja hueco a los dem\xE1s.",v:["nadie m\xE1s ha conseguido terminar una frase en toda la cena.","decide el destino del viaje de grupo sin que nadie m\xE1s opine.","interrumpe a media frase y sigue como si no hubiera pasado nada."]},{p:"Histri\xF3nico",d:"busca ser el centro con dramatismo y teatralidad.",v:["cuenta un pinchazo de rueda como si hubiera sobrevivido a un accidente.","se lleva la mano al pecho cuando le sorprenden con algo m\xEDnimo.","convierte un comentario cualquiera en una escena con p\xFAblico."]}]},{nombre:"iniciativa y empuje",entradas:[{p:"Resuelto",d:"se decide r\xE1pido y act\xFAa sin darle vueltas.",v:["mientras los dem\xE1s debaten, ya ha llamado y lo ha resuelto.","detecta el problema y ya est\xE1 marcando el n\xFAmero antes de que acabes de explicarlo.","no espera a tener todos los datos para moverse."]},{p:"Emprendedor",d:"arranca cosas por su cuenta.",v:["tiene dos proyectos en marcha adem\xE1s de su trabajo.","convierte una afici\xF3n de fin de semana en un peque\xF1o negocio.","ve un hueco en el mercado donde los dem\xE1s solo ven una tienda m\xE1s."]},{p:"Lanzado",d:"se mete en situaciones sociales sin c\xE1lculo previo.",v:["se presenta \xE9l solo a la mesa que no conoce.","se apunta al viaje sin mirar qui\xE9n m\xE1s va.","levanta la mano para la propuesta antes de saber en qu\xE9 consiste."]},{p:"Audaz",d:"asume riesgos calculados que otros no asumir\xEDan.",v:["pide el aumento con los n\xFAmeros delante y sin rodeos.","presenta la idea arriesgada en vez de la segura.","cambia de sector cuando el suyo empieza a decaer, sin esperar a que sea tarde."]},{p:"Temerario",d:"asume riesgos sin calcular. Es el exceso de *audaz*.",v:['firma la reforma sin presupuesto porque "ya se ver\xE1".',"adelanta en la curva sin ver lo que viene.","invierte los ahorros en lo primero que le suena bien."]},{p:"Asertivo",d:"defiende lo suyo con claridad sin pisar al otro.",v:['dice "esto no me va bien" sin enfadarse ni pedir perd\xF3n.',"rechaza el plan que no le apetece sin dar tres excusas.","pide que le paguen lo acordado sin rodeos ni disculpas."]},{p:"Dominante",d:"tiende a llevar el mando del grupo de forma natural.",v:["nadie le ha nombrado nada y todos esperan a que \xE9l decida.","en cualquier grupo nuevo, en media hora ya lleva la voz cantante.","reparte las tareas sin que nadie se lo haya pedido."]},{p:"Mand\xF3n",d:"da \xF3rdenes sin tener autoridad para ello.",v:["organiza tu cocina cuando viene a cenar a tu casa.","le dice al camarero c\xF3mo debe servir la mesa.","corrige c\xF3mo aparcas el coche aunque no se lo hayas preguntado."]}]}]},{nombre:"Polo reservado",familias:[{nombre:"General",entradas:[{p:"Introvertido",d:"se recarga en soledad. **No significa t\xEDmido**: puede ser un excelente conversador y aun as\xED necesitar irse pronto.",v:["despu\xE9s de un d\xEDa social intenso necesita dos horas solo para recuperarse.","prefiere una cena con dos amigos a una fiesta con cincuenta.","se va de la reuni\xF3n en cuanto ha dicho lo que ten\xEDa que decir."]},{p:"T\xEDmido",d:"quiere el contacto pero le da apuro. El introvertido no lo necesita; el t\xEDmido s\xED lo quiere y no puede.",v:["se le ve rondando el grupo sin acabar de entrar.","quiere hablar en la reuni\xF3n, ensaya la frase, y al final no la dice.","se pone rojo si le miran mientras habla."]},{p:"Retra\xEDdo",d:"se aparta de los dem\xE1s, de forma habitual y sin conflicto.",v:["en las comidas de empresa se sienta en la punta y no se mueve.","sale del grupo de fotos antes de que le toque.","en la fiesta se pasa la noche cerca de la puerta."]},{p:"Reservado",d:"trata con normalidad pero no cuenta lo suyo.",v:["llevas tres a\xF1os trabajando con \xE9l y no sabes si tiene hijos.",'responde a c\xF3mo est\xE1 con un "bien" y cambia de tema.',"nunca cuenta c\xF3mo le fue el fin de semana si no se lo preguntas."]},{p:"Discreto",d:"sabe qu\xE9 se calla y cu\xE1ndo. Es la versi\xF3n virtuosa de reservado.",v:["le cuentas algo delicado y sabes que ah\xED muere.","sabe el sueldo de todos y no lo comenta nunca.","no menciona delante de otros el favor que te hizo."]},{p:"Herm\xE9tico",d:"no deja ver absolutamente nada, ni siquiera lo que siente.",v:["le dan una mala noticia y su cara no cambia.","nunca sabes si algo le ha molestado hasta mucho despu\xE9s.","puede llevar semanas con un problema serio y no se le nota nada."]},{p:"Taciturno",d:"callado y de fondo sombr\xEDo. No es solo silencio: es silencio con peso.",v:["est\xE1 en la mesa y su silencio se nota.","entra en la sala y el ambiente se vuelve m\xE1s pesado sin que diga nada.","responde con una palabra a preguntas que merecen una frase."]},{p:"Hura\xF1o",d:"reh\xFAye el trato y adem\xE1s lo hace con aspereza.",v:["contesta con monos\xEDlabos para que le dejes en paz.","cierra la puerta del despacho en cuanto alguien se acerca a charlar.","el saludo de buenos d\xEDas le sale como un gru\xF1ido."]},{p:"Esquivo",d:"evita el contacto sin llegar a negarse abiertamente.",v:["siempre tiene un plan justo el d\xEDa que qued\xE1is.","responde al mensaje tres d\xEDas despu\xE9s con una excusa vaga.","cambia de acera cuando ve venir a alguien que no le apetece saludar."]},{p:"Solitario",d:"est\xE1 a gusto solo y organiza su vida para estarlo.",v:["se va de viaje solo por gusto, no por falta de compa\xF1\xEDa.","prefiere comer solo con un libro que en el grupo de la oficina.","vive perfectamente feliz sin plan para el s\xE1bado."]}]}]}]},{n:2,titulo:"Trato con los dem\xE1s",intro:"C\xF3mo trata a la gente cuando no gana nada con ello. Es la dimensi\xF3n que mejor predice si convivir con alguien resulta agradable.",polos:[{nombre:"Polo c\xE1lido",familias:[{nombre:"trato agradable",entradas:[{p:"Amable",d:"trato considerado y educado por norma.",v:["da las gracias al repartidor por su nombre.","sostiene la puerta y espera a que pases sin prisa.","saluda al de seguridad todas las ma\xF1anas por su nombre."]},{p:"Cordial",d:"cercano y c\xE1lido en el trato, sin llegar a la intimidad.",v:["te recibe con una sonrisa real aunque apenas os conozc\xE1is.","en la reuni\xF3n con la competencia, el trato sigue siendo correcto y agradable.","se despide con un apret\xF3n de manos sincero aunque haya sido un d\xEDa dif\xEDcil."]},{p:"Afable",d:"agradable y f\xE1cil de tratar; da gusto hablar con \xE9l.",v:["la conversaci\xF3n fluye sin esfuerzo desde el primer minuto.","hasta el cliente m\xE1s quejica sale de hablar con \xE9l de mejor humor.","cae bien a la primera sin propon\xE9rselo."]},{p:"Afectuoso",d:"muestra cari\xF1o de forma habitual.",v:["pregunta por tu madre y se acuerda de c\xF3mo se llama.","te manda un mensaje solo para saber c\xF3mo te fue el examen.","te aprieta el hombro cuando te ve preocupado, sin decir nada m\xE1s."]},{p:"Accesible",d:"se deja abordar, no pone barreras de rango.",v:["le puedes interrumpir sin miedo aunque est\xE9 ocupado.","cualquiera de la plantilla puede llamar a su puerta sin pedir cita.","responde los mensajes de la gente nueva igual que los del equipo de siempre."]},{p:"Llano",d:"sin pretensiones ni f\xF3rmulas; trata a todos igual.",v:["habla igual con un cliente que con un pe\xF3n.",'no cambia el tono cuando entra alguien "importante" a la sala.',"se sienta donde haya sitio, no donde le corresponde por cargo."]}]},{nombre:"sensibilidad al otro",entradas:[{p:"Emp\xE1tico",d:"capta lo que el otro siente. Es una capacidad, no una virtud: los manipuladores h\xE1biles la tienen alta.",v:["nota que est\xE1s mal antes de que lo digas.","baja la voz en cuanto ve que el tema te incomoda.","sabe leer cu\xE1ndo alguien necesita hablar y cu\xE1ndo necesita silencio."]},{p:"Compasivo",d:"se conmueve con el mal ajeno y quiere aliviarlo. Aqu\xED s\xED hay virtud: empat\xEDa **m\xE1s** intenci\xF3n de ayudar.",v:["se para a ayudar aunque le cueste llegar tarde.","se le llenan los ojos al ver un problema que no es suyo.","hace un hueco en su semana para acompa\xF1ar a quien lo est\xE1 pasando mal."]},{p:"Considerado",d:"piensa en el efecto que sus actos tienen sobre ti.",v:["no llama a las once de la noche porque sabe que madrugas.","avisa con tiempo si va a llegar tarde para que no le esperes.","pregunta antes de invitar a alguien m\xE1s al plan que ya ten\xEDais."]},{p:"Atento",d:"se anticipa a lo que necesitas.",v:["aparece con el caf\xE9 como lo tomas sin haberlo pedido.","se acuerda de que hoy ten\xEDas la entrevista y pregunta c\xF3mo fue.","te guarda sitio sin que se lo pidas."]},{p:"Sol\xEDcito",d:"se ofrece con prontitud, a veces m\xE1s de la cuenta.",v:["se levanta a ayudar antes de que nadie lo pida.","se ofrece a llevarte en coche en cuanto oye que tu coche est\xE1 en el taller.","aparece con la escalera antes de que termines de decir que la necesitas."]}]},{nombre:"dar",entradas:[{p:"Generoso",d:"da con facilidad tiempo, dinero o atenci\xF3n.",v:["te deja la furgoneta el fin de semana sin preguntar para qu\xE9.","invita sin que nadie se lo espere y sin hacerlo notar.","reparte su tiempo libre con quien lo necesita sin llevar la cuenta."]},{p:"Desprendido",d:"no se aferra a lo material.",v:["regala la herramienta que le sobra en vez de guardarla por si acaso.","vac\xEDa el armario de ropa que ya no usa en cuanto alguien la necesita.","no le cuesta nada dar algo que valora si a otro le hace m\xE1s falta."]},{p:"Altruista",d:"act\xFAa en beneficio ajeno sin esperar retorno.",v:["dedica los s\xE1bados a algo que no le da nada a cambio.","dona parte de lo que gana un mes bueno sin publicarlo.","ayuda a quien nunca va a devolv\xE9rselo, porque no es lo que busca."]},{p:"Magn\xE1nimo",d:"grandeza de \xE1nimo: perdona, no se cobra las deudas, no se rebaja a la peque\xF1ez.",v:["pudiendo humillar al que se equivoc\xF3, le quita hierro delante de todos.","gana el pleito y no se lo restriega al que perdi\xF3.","perdona una deuda grande sin hacer sentir mal a quien la deb\xEDa."]}]},{nombre:"ceder (con su exceso)",entradas:[{p:"Conciliador",d:"busca el punto de acuerdo entre posturas.",v:["reformula lo que dice cada uno hasta que ambos se reconocen.","busca la frase que deje bien a los dos lados de la discusi\xF3n.","propone partir la diferencia antes de que la cosa se enquiste."]},{p:"Transigente",d:"cede en lo suyo para que la cosa avance.",v:["acepta el sitio que no le gusta para no alargar el debate.","cede en el nombre del proyecto porque lo importante ya est\xE1 decidido.","deja pasar el detalle menor para no bloquear lo grande."]},{p:"Indulgente",d:"perdona faltas con facilidad.",v:["le fallas y a la semana siguiente ya est\xE1 resuelto.","no saca en cara el error una vez pasado el enfado.","da una segunda oportunidad sin exigir explicaciones eternas."]},{p:"Complaciente",d:"cede por agradar, no por convicci\xF3n. Aqu\xED empieza el exceso.",v:["dice que s\xED a todo y luego no puede con la carga.","acepta el turno que nadie quiere por no decir que no.","cambia sus planes cada vez que otro le pide algo, aunque le cueste."]},{p:"Sumiso",d:"se pliega sistem\xE1ticamente a la voluntad ajena.",v:['nunca sabes qu\xE9 prefiere porque siempre dice "lo que t\xFA veas".',"deja que decidan por \xE9l incluso en lo que solo le afecta a \xE9l.","no lleva la contraria ni cuando tiene motivos claros para hacerlo."]},{p:"Servil",d:"se pliega **y adem\xE1s** se rebaja, buscando el favor del otro.",v:["cambia de tono y de postura corporal cuando entra el jefe.","se r\xEDe m\xE1s fuerte de los chistes de quien puede beneficiarle.","se ofrece a hacer recados personales que no le corresponden, solo al que manda."]},{p:"Pusil\xE1nime",d:'literalmente "de \xE1nimo peque\xF1o": le falta arrojo para sostener lo suyo.',v:["sabe que tiene raz\xF3n y calla por no discutir.","deja pasar la injusticia por no tener que enfrentarse a nadie.","renuncia a lo que le corresponde con tal de evitar el conflicto."]},{p:"Apocado",d:"se achica ante los dem\xE1s; pierde presencia en cuanto hay alguien de m\xE1s car\xE1cter.",v:["baja la voz y se retira de la conversaci\xF3n cuando entra el que manda.","ocupa la silla m\xE1s apartada de la sala sin que nadie se lo pida.","deja de opinar en cuanto alguien le lleva la contraria con firmeza."]}]}]},{nombre:"Polo \xE1spero",familias:[{nombre:"frialdad en el trato",entradas:[{p:"Seco",d:"trata sin adorno ni calidez. No implica mala intenci\xF3n.",v:["contesta lo justo y se da la vuelta.",'responde con un "ya" a algo que merec\xEDa una frase.','no suelta un "gracias" ni cuando le hacen un favor grande.']},{p:"Adusto",d:"serio y severo en el gesto y en el trato.",v:["nunca le has visto la cara relajada.","entra en la fiesta y parece que viene de un funeral.","su cara de serio no cambia ni cuando le felicitan."]},{p:"Brusco",d:"corta y responde de golpe, sin modular.",v:['te interrumpe con un "no" seco y sigue a lo suyo.','coge el documento de tus manos sin decir "perdona".',"responde a la pregunta con un tono que corta la conversaci\xF3n."]},{p:"Cortante",d:"zanja la conversaci\xF3n de forma tajante.",v:["una frase suya deja la mesa en silencio.",'zanja la propuesta con un "no" y no da m\xE1s explicaci\xF3n.',"corta el tema con un gesto de mano antes de que acabes de plantearlo."]},{p:"Desabrido",d:"trato desagradable, sin gracia, que deja mal sabor.",v:["sales de hablar con \xE9l molesto sin saber exactamente por qu\xE9.","te atiende sin un solo gesto amable, aunque no diga nada raro.","la conversaci\xF3n t\xE9cnica es correcta y aun as\xED deja mal cuerpo."]},{p:"Displicente",d:"te trata con desgana, como si atenderte le supusiera un esfuerzo.",v:["responde sin levantar la vista del m\xF3vil.","contesta a tu pregunta como si le robaras el tiempo.","atiende el mostrador como si fuera un favor que te hace."]},{p:"Despectivo",d:"trata con desprecio abierto.",v:['se refiere a tu trabajo como "eso que haces t\xFA".',"habla del barrio donde creciste como si fuera motivo de verg\xFCenza.","pone un gesto de asco cuando alguien menciona su afici\xF3n."]},{p:"Fr\xEDo",d:"no conecta emocionalmente, ni da ni pide.",v:["le cuentas una desgracia y pasa al siguiente tema.","no hay abrazo ni en la despedida m\xE1s larga.","felicita el \xE9xito con la misma cara con la que comenta el tiempo."]},{p:"Indiferente",d:"le da igual lo que te pase.",v:["no pregunta ni una vez c\xF3mo sali\xF3 aquello que te preocupaba.","le cuentas que te vas a mudar y sigue mirando el m\xF3vil.","da igual que ganes o que pierdas: la reacci\xF3n es la misma."]},{p:"Insensible",d:"no registra el da\xF1o que causa o que ve.",v:["hace el chiste justo delante de la persona a la que le duele.","no baja el tono ni cuando ve que alguien se ha puesto a llorar.","sigue con la broma despu\xE9s de que le digan que molesta."]},{p:"Desconsiderado",d:"no tiene en cuenta el efecto de sus actos sobre los dem\xE1s.",v:["aparca donde te bloquea la salida porque le ven\xEDa bien.","pone m\xFAsica alta sabiendo que hay quien duerme al lado.","cancela el plan una hora antes sin pensar en lo que ya hab\xEDas organizado."]}]},{nombre:"irritabilidad y hostilidad",entradas:[{p:"Irritable",d:"salta con facilidad ante lo peque\xF1o.",v:["un sem\xE1foro le arruina la ma\xF1ana.","salta por un comentario que no iba con mala intenci\xF3n.","cualquier cola larga le pone de mal humor el resto del d\xEDa."]},{p:"Susceptible",d:"se ofende con facilidad y lee ataque donde no lo hay.",v:["le comentas algo neutro y responde a la defensiva.","interpreta una broma inocente como un ataque personal.","se ofende porque no le han consultado algo menor."]},{p:"Quisquilloso",d:"se molesta por detalles nimios y los saca a relucir.",v:["dedica diez minutos a que le pusieron la servilleta mal doblada.","se queja de que el caf\xE9 no est\xE1 exactamente a su temperatura.","hace un comentario sobre c\xF3mo se ha colocado el mando a distancia."]},{p:"Iracundo",d:"propenso a la ira intensa.",v:["pasa de cero a gritos en un segundo.","da un golpe en la mesa por un error menor.","sube la voz antes de haber terminado de escuchar la explicaci\xF3n."]},{p:"Hostil",d:"su disposici\xF3n de fondo hacia los dem\xE1s es de enemistad.",v:["interpreta cualquier propuesta ajena como una maniobra en su contra.","responde a un saludo con un gesto seco, sin motivo aparente.","trata cualquier pregunta como si fuera un desaf\xEDo."]},{p:"Belicoso",d:"busca activamente la pelea.",v:["entra en discusiones que no van con \xE9l.","busca la r\xE9plica incluso cuando nadie le ha llevado la contraria.","convierte una charla tranquila en un pulso."]},{p:"Ciza\xF1ero",d:"siembra discordia entre otros.",v:["le cuenta a cada uno lo que dijo el otro, con retoques.","deja caer un comentario para que dos compa\xF1eros se enfaden entre ellos.","avisa a uno de algo que el otro nunca dijo as\xED."]},{p:"Rencoroso",d:"guarda la ofensa mucho tiempo.",v:["saca en una discusi\xF3n algo que pas\xF3 hace seis a\xF1os.","sigue sin hablarle a alguien por algo que pas\xF3 en otra etapa de su vida.","no olvida un desprecio aunque hayan pasado a\xF1os y ya se disculparan."]},{p:"Vengativo",d:"adem\xE1s de guardarla, se la cobra.",v:["espera el momento y te deja tirado justo cuando le necesitas.","se asegura de que el otro pague la ofensa, tarde o temprano.","guarda la informaci\xF3n hasta el momento en que m\xE1s da\xF1o puede hacer."]},{p:"Resentido",d:"arrastra un agravio general contra la vida o contra un grupo.",v:["atribuye todo \xE9xito ajeno a un enchufe o a una trampa.","habla de su antiguo trabajo con un rencor que no cuadra con el tiempo pasado.","convierte cualquier conversaci\xF3n en una queja sobre lo injusto que ha sido todo con \xE9l."]}]},{nombre:"cr\xEDtica hiriente",entradas:[{p:"Critic\xF3n",d:"encuentra el defecto de todo.",v:["en cualquier restaurante hay algo que est\xE1 mal.","encuentra un pero hasta en la buena noticia de otro.","comenta lo que no le gusta de cada cosa que ve."]},{p:"Mordaz",d:"critica con ingenio y hace da\xF1o. La gracia es parte del filo.",v:["suelta una frase que hace re\xEDr a todos menos a uno.","responde con una pulla que deja a la otra persona sin saber qu\xE9 decir.","el comentario tiene gracia y tambi\xE9n tiene filo."]},{p:"Sarc\xE1stico",d:"dice lo contrario de lo que quiere decir para herir.",v:['aplaude despacio y dice "qu\xE9 bien lo has hecho".','responde con un "genial, otra vez" cuando algo sale mal por en\xE9sima vez.','dice "no, si t\xFA tienes toda la raz\xF3n" con retint\xEDn.']},{p:"Ir\xF3nico",d:"dice lo contrario de lo que quiere decir, sin intenci\xF3n de herir. La iron\xEDa es un recurso; el sarcasmo es un arma.",v:['comenta "menudo veranito" en pleno diluvio.','llama "puntual" al que llega media hora tarde, sin acritud.','dice "vaya suerte la m\xEDa" cuando pierde el autob\xFAs por un minuto.']},{p:"C\xE1ustico",d:"su cr\xEDtica corroe, va contra la persona y no contra la obra.",v:["no critica tu idea, critica que se te haya ocurrido a ti.","hace un comentario que apunta a qui\xE9n eres, no a lo que has hecho.","la cr\xEDtica se recuerda m\xE1s por lo que doli\xF3 que por lo que aport\xF3."]},{p:"Falt\xF3n",d:"cruza la l\xEDnea del respeto con facilidad.",v:["en cuanto se calienta, la discusi\xF3n pasa a lo personal.","suelta un comentario sobre tu aspecto en medio de una discusi\xF3n de trabajo.","no distingue entre criticar la idea y criticar a la persona."]}]}]}]},{n:3,titulo:"Orden y voluntad",intro:"Si se puede contar con esa persona: si hace lo que dice, cu\xE1ndo lo hace y con qu\xE9 cuidado. Es la dimensi\xF3n que mejor predice el rendimiento en el trabajo y la salud de una convivencia.",polos:[{nombre:"Polo met\xF3dico",familias:[{nombre:"fiabilidad",entradas:[{p:"Responsable",d:"responde por lo que hace y por lo que le corresponde.",v:["asume el error sin buscar a qui\xE9n repart\xEDrselo.","avisa \xE9l mismo cuando algo se le ha pasado, antes de que lo descubran.","se queda hasta terminar lo que le tocaba, aunque ya sea tarde."]},{p:"Cumplidor",d:"hace lo que dice que va a hacer.",v:["dijo el jueves y estaba el jueves.","entrega en la fecha que prometi\xF3, sin necesidad de recordatorio.","lo que promete en una llamada, lo tienes por escrito al d\xEDa siguiente."]},{p:"Fiable",d:"puedes construir sobre lo que promete.",v:["le delegas algo importante y dejas de pensar en ello.","si dice que se encarga, ya no hace falta comprobarlo.","en diez a\xF1os nunca te ha dejado colgado."]},{p:"Formal",d:"cumple lo pactado y guarda las formas del compromiso.",v:["avisa con antelaci\xF3n cuando no va a poder.","si algo cambia, es el primero en dec\xEDrtelo, no el \xFAltimo en enterarse t\xFA.","cumple el acuerdo tal y como se dijo, sin letra peque\xF1a despu\xE9s."]},{p:"Puntual",d:"llega a la hora. Parece menor y es la se\xF1al barata m\xE1s informativa que existe.",v:["est\xE1 en la puerta cinco minutos antes.","empieza la reuni\xF3n a la hora exacta aunque falte alguien.","nunca ha hecho esperar a nadie por su culpa."]}]},{nombre:"orden y cuidado",entradas:[{p:"Organizado",d:"tiene un sistema y lo mantiene.",v:["encuentra el papel de hace dos a\xF1os en treinta segundos.","tiene un sitio para cada cosa y cada cosa est\xE1 en su sitio.","la mudanza le lleva la mitad de tiempo que a cualquiera porque ya lo ten\xEDa todo etiquetado."]},{p:"Met\xF3dico",d:"sigue siempre el mismo procedimiento para lo mismo.",v:["recoge las herramientas en el mismo orden todos los d\xEDas.","sigue siempre los mismos pasos para cerrar la caja, sin saltarse ninguno.","hace la compra con la misma lista y el mismo recorrido cada semana."]},{p:"Sistem\xE1tico",d:"aborda las cosas por partes y sin saltarse pasos.",v:["antes de tocar nada, comprueba lo que ya ha comprobado mil veces.","descarta las causas una por una en vez de probar al azar.","sigue el mismo protocolo de revisi\xF3n aunque el fallo parezca obvio."]},{p:"Meticuloso",d:"atiende al detalle peque\xF1o.",v:["repasa el remate que nadie va a ver.","revisa tres veces la cifra aunque ya la haya comprobado dos.","cuida el reverso del trabajo igual que la parte visible."]},{p:"Minucioso",d:"meticuloso **y** exhaustivo: no deja nada fuera.",v:["entrega el informe con los ocho casos, no con los tres importantes.","no deja fuera ni el detalle que parec\xEDa irrelevante.","documenta cada paso, no solo el resultado final."]},{p:"Escrupuloso",d:"cuidado extremo, con un componente de conciencia moral: no se permite hacerlo regular.",v:["rehace un trabajo ya cobrado porque no le convence.","no firma algo que no cumple del todo, aunque nadie lo fuera a notar.","declara hasta el ingreso menor porque no concibe hacerlo a medias."]},{p:"Pulcro",d:"limpio y cuidado en la forma y en la presentaci\xF3n.",v:["su furgoneta y sus cajas est\xE1n igual de ordenadas que su casa.","entrega el trabajo limpio, sin una mancha ni un cable fuera de sitio.","su mesa est\xE1 igual de recogida un lunes que un viernes."]}]},{nombre:"voluntad sostenida",entradas:[{p:"Disciplinado",d:"hace lo que toca aunque no le apetezca.",v:["mantiene la rutina tambi\xE9n en las semanas malas.","se levanta a entrenar aunque haya dormido mal.","sigue el plan aunque nadie vaya a comprobar si lo cumple."]},{p:"Constante",d:"sostiene el esfuerzo en el tiempo.",v:["lleva cuatro a\xF1os haciendo lo mismo sin bajar el ritmo.","el nivel de hoy es el mismo que el de hace un a\xF1o.","no necesita motivaci\xF3n extra para seguir, sigue porque toca."]},{p:"Tenaz",d:"no suelta la presa aunque la cosa se ponga dif\xEDcil.",v:["lleva tres d\xEDas con la misma aver\xEDa y sigue midiendo.","prueba la sexta soluci\xF3n despu\xE9s de que las cinco anteriores fallaran.","no suelta el problema hasta que lo entiende del todo."]},{p:"Perseverante",d:"insiste tras el fracaso.",v:["le dicen que no y vuelve con otra propuesta.","presenta el proyecto una tercera vez con los ajustes que pidieron.","sigue mandando curr\xEDculums despu\xE9s de veinte respuestas negativas."]},{p:"Diligente",d:"hace las cosas con prontitud **y** con cuidado. Las dos a la vez.",v:["pides algo y est\xE1 hecho esa misma tarde, y bien.","responde al correo importante en cuanto lo lee, no al final del d\xEDa.","resuelve el tr\xE1mite antes de que se lo tengan que recordar."]},{p:"Aplicado",d:"se esfuerza en aprender y en hacerlo bien.",v:["se estudia el manual del equipo nuevo antes de que llegue.","toma notas en la formaci\xF3n aunque ya lleve a\xF1os en el oficio.","repite el ejercicio hasta hacerlo bien, no hasta que le canse."]},{p:"Previsor",d:"se adelanta a lo que puede pasar.",v:["lleva el recambio que casi nunca hace falta.","reserva el hotel con meses de antelaci\xF3n, no la semana antes.","tiene un plan B preparado sin que nadie se lo haya pedido."]},{p:"Prudente",d:"mide el riesgo antes de actuar.",v:["no toca el cuadro sin comprobar dos veces que no hay tensi\xF3n.","espera a tener el contrato firmado antes de dejar el trabajo anterior.","no se compromete con una fecha hasta estar seguro de poder cumplirla."]},{p:"Cauto",d:"act\xFAa con reserva, no se expone.",v:["no da su opini\xF3n hasta saber qui\xE9n hay en la sala.","prueba el terreno con una pregunta antes de contar lo que piensa.","no firma nada en la primera reuni\xF3n, se lo lleva para leerlo con calma."]}]},{nombre:"el exceso de orden",entradas:[{p:"Perfeccionista",d:"no da nada por bueno hasta que es impecable.",v:["la entrega se retrasa por detalles que nadie ha pedido.","rehace la presentaci\xF3n por una fuente que no queda del todo bien.","no da el proyecto por cerrado aunque ya cumpla de sobra."]},{p:"Puntilloso",d:"se detiene en detalles menores y los convierte en asunto.",v:["corrige una coma en un mensaje de WhatsApp.","para la reuni\xF3n para se\xF1alar un error de formato sin importancia.","dedica el comentario m\xE1s largo al detalle m\xE1s peque\xF1o del documento."]},{p:"R\xEDgido",d:"no adapta el procedimiento aunque la situaci\xF3n haya cambiado.",v:["sigue el protocolo cuando el protocolo ya no sirve.","no cambia el plan aunque las circunstancias hayan cambiado del todo.","aplica la misma norma a un caso que claramente es distinto."]},{p:"Cuadriculado",d:"solo concibe una manera de hacer las cosas.",v:['rechaza una soluci\xF3n mejor porque "no es como se hace".',"no concibe hacer la ruta de otra manera aunque sea m\xE1s larga.","se bloquea cuando el plan cambia sobre la marcha."]},{p:"Mani\xE1tico",d:"tiene fijaciones concretas e innegociables.",v:["no puede empezar si la mesa no est\xE1 exactamente as\xED.","necesita que las cosas del armario miren todas hacia el mismo lado.","repite un gesto exacto antes de cada tarea, sin el cual no se siente c\xF3modo."]}]}]},{nombre:"Polo descuidado",familias:[{nombre:"General",entradas:[{p:"Desorganizado",d:"no tiene sistema.",v:["pierde veinte minutos cada ma\xF1ana buscando algo.","no sabe d\xF3nde ha puesto las llaves ni un solo d\xEDa de la semana.","improvisa el orden del d\xEDa de la reuni\xF3n mientras ya ha empezado."]},{p:"Ca\xF3tico",d:"su desorden le desborda y salpica a los dem\xE1s.",v:["su desorden te obliga a ti a rehacer cosas.","deja el proyecto a medias y otro tiene que entender por d\xF3nde iba.","cambia de plan tres veces en una tarde y arrastra a todos con \xE9l."]},{p:"Disperso",d:"empieza muchas cosas y salta de una a otra.",v:["tiene cinco tareas abiertas y ninguna cerrada.","empieza a ordenar el caj\xF3n y termina viendo fotos antiguas.","se pone con una cosa y a los diez minutos ya est\xE1 con otra distinta."]},{p:"Descuidado",d:"no pone atenci\xF3n en lo que hace.",v:["deja el trabajo bien hecho por dentro y hecho un desastre por fuera.","entrega el informe con faltas que una lectura r\xE1pida habr\xEDa pillado.","no se fija en el detalle que luego causa el problema."]},{p:"Negligente",d:"su descuido causa da\xF1o real. Es la versi\xF3n con consecuencias.",v:["no revisa lo que sabe que hay que revisar y alguien lo paga.",'salta el paso de seguridad porque "nunca pasa nada".',"firma sin leer lo que est\xE1 firmando y luego lo lamenta otro."]},{p:"Chapucero",d:'hace las cosas r\xE1pido y mal, dej\xE1ndolas "que aguanten".',v:["la soluci\xF3n dura tres semanas y luego hay que volver.","tapa el problema en vez de arreglarlo de ra\xEDz.","deja el cable sujeto con cinta en vez de con el conector que toca."]},{p:"Dejado",d:"abandona el cuidado de lo suyo (trabajo, casa, aspecto).",v:["lo que se estropea se queda estropeado.","lleva meses con la misma bombilla fundida sin cambiarla.",'deja que el jard\xEDn se llene de maleza porque "ya lo har\xE1".']},{p:"Informal",d:"no cumple lo que dice ni avisa.",v:["qued\xE1is y desaparece sin mensaje.","promete llamar y no llama, sin dar ninguna explicaci\xF3n despu\xE9s.","confirma la cita y luego no aparece ni avisa."]},{p:"Inconstante",d:"arranca con fuerza y abandona.",v:["lleva ocho aficiones empezadas y ninguna a medio camino.","se apunta al gimnasio en enero y no vuelve en marzo.","empieza el curso con entusiasmo y lo deja a la tercera clase."]},{p:"Voluble",d:"cambia de criterio o de \xE1nimo con facilidad.",v:["lo que hoy es prioridad absoluta, el lunes ni se menciona.","cambia de plan de fin de semana tres veces en un d\xEDa.","un d\xEDa quiere mudarse de ciudad y a la semana ya no se acuerda."]},{p:"Perezoso",d:"evita el esfuerzo.",v:["siempre encuentra el modo de que lo haga otro.","deja para ma\xF1ana lo que podr\xEDa resolver en cinco minutos hoy.","prefiere quedarse sin algo antes que levantarse a por ello."]},{p:"Indolente",d:"ni se esfuerza ni le importa no esforzarse. A\xF1ade indiferencia a la pereza.",v:["le dices que va a salir mal y se encoge de hombros.","ve el problema crecer y no mueve un dedo para evitarlo.","ni se esfuerza ni parece que le importe el resultado."]},{p:"Ap\xE1tico",d:"no le mueve nada, ni siquiera lo suyo.",v:["le ofreces algo que le gustaba y le da igual.","no reacciona ni a la buena ni a la mala noticia.",'responde con un "bueno" a casi cualquier propuesta.']},{p:"Acomodado",d:"se instala en lo c\xF3modo y no sale de ah\xED.",v:["rechaza una oportunidad clara por no cambiar de rutina.","sigue en el mismo puesto mediocre porque cambiar da pereza.","prefiere lo conocido y regular a lo nuevo y mejor."]},{p:"Impulsivo",d:"act\xFAa antes de pensar.",v:["compra, contesta o dimite en caliente.","manda el mensaje enfadado antes de pensarlo dos minutos.","decide el viaje esa misma noche y compra los billetes ya."]},{p:"Irreflexivo",d:"no valora las consecuencias.",v:["dice lo primero que le pasa por la cabeza delante de quien no debe.","acepta el trato sin leer las condiciones.","act\xFAa sin preguntarse qu\xE9 puede salir mal."]},{p:"Atolondrado",d:"se l\xEDa, se precipita y se equivoca por atropello.",v:["sale de casa sin las llaves tres veces por semana.","se confunde de reuni\xF3n y aparece en la sala equivocada.","empieza a explicar algo y se pierde a la mitad."]},{p:"Fr\xEDvolo",d:"no da peso a lo que lo tiene.",v:["se toma a broma el problema serio de otro.","habla del despido de un compa\xF1ero con el mismo tono que del tiempo.","no le da la importancia debida a una decisi\xF3n que s\xED la tiene."]}]}]}]},{n:4,titulo:"Temple emocional",intro:"C\xF3mo reacciona por dentro cuando las cosas se tuercen: con qu\xE9 facilidad se altera, cu\xE1nto tarda en volver a su sitio y qu\xE9 hace mientras tanto. Es la dimensi\xF3n que m\xE1s sufre la gente que convive con ella y la que menos se ve en una primera impresi\xF3n.",polos:[{nombre:"Polo sereno",familias:[{nombre:"General",entradas:[{p:"Sereno",d:"mantiene la calma cuando la situaci\xF3n se complica.",v:["salta la alarma y \xE9l baja el tono en vez de subirlo.","recibe la mala noticia y sigue pensando con claridad.","gestiona la urgencia sin que se le note el pulso."]},{p:"Templado",d:"tiene la emoci\xF3n bajo control sin reprimirla; ni fr\xEDo ni desbordado.",v:["se enfada de verdad y aun as\xED se le entiende todo lo que dice.","expresa el disgusto sin que suba de tono ni pierda el hilo.","vive el disgusto por dentro sin que se convierta en un espect\xE1culo."]},{p:"Ecu\xE1nime",d:"mantiene el mismo criterio le afecte a \xE9l o a otro.",v:["juzga igual el error de su amigo que el del que le cae mal.","reparte la cr\xEDtica con la misma vara a quien le gusta y a quien no.","no cambia su valoraci\xF3n de un trabajo seg\xFAn qui\xE9n lo haya hecho."]},{p:"Imperturbable",d:"nada le altera visiblemente.",v:["le dan la peor noticia del a\xF1o y sigue con el mismo pulso.","la sala se altera y \xE9l sigue con el mismo tono de siempre.","nada de lo que pasa esa semana se le nota en la cara."]},{p:"Flem\xE1tico",d:"lento en alterarse, de reacci\xF3n pausada por temperamento.",v:["todos corriendo y \xE9l a su ritmo, y llega igual.","recibe la avalancha de trabajo sin acelerar el paso.","reacciona a la urgencia con la misma calma que a un d\xEDa tranquilo."]},{p:"Estoico",d:"aguanta el dolor y la adversidad sin quejarse.",v:["lleva dos meses con un problema serio y te enteras por otro.","sigue trabajando con el mismo rendimiento pese al dolor de espalda.","no se queja aunque la situaci\xF3n d\xE9 motivos de sobra."]},{p:"Sosegado",d:"vive a un ritmo interior tranquilo.",v:["nunca tiene prisa aunque vaya justo.","hace las cosas a su ritmo aunque el reloj apriete.","camina con el mismo paso llegue tarde o llegue con tiempo."]},{p:"Apacible",d:"de trato y de humor suaves, transmite calma.",v:["estar con \xE9l te baja las pulsaciones.","su tono de voz relaja incluso cuando el tema es tenso.","la casa se nota m\xE1s tranquila cuando est\xE1 \xE9l."]},{p:"Resiliente",d:"se recupera del golpe y sigue.",v:["pierde el trabajo y a las dos semanas ya est\xE1 en otra cosa.","el golpe le deja tocado un par de d\xEDas y luego sigue adelante.","sale del bache sin necesitar que nadie le empuje."]},{p:"Entero",d:"no se rompe delante del problema.",v:["organiza el funeral de su padre sin venirse abajo.","da la mala noticia al equipo sin que le tiemble la voz.","sostiene a los dem\xE1s mientras \xE9l tambi\xE9n est\xE1 pas\xE1ndolo mal."]},{p:"Curtido",d:"se ha endurecido por experiencia acumulada, no por car\xE1cter.",v:["lo que a los dem\xE1s les parece una crisis, \xE9l ya lo ha visto tres veces.","no se altera ante un problema que ya ha resuelto otras veces.","los a\xF1os en el oficio le han quitado el susto a los imprevistos."]},{p:"Aplomado",d:"tiene seguridad de porte: se le nota firme y asentado.",v:["habla delante de cincuenta personas sin que le tiemble la voz.","responde a la pregunta inc\xF3moda sin perder el paso.","entra en la sala de espera y su seguridad se nota antes de que hable."]},{p:"Seguro de s\xED",d:"conf\xEDa en su propio criterio.",v:["sostiene su decisi\xF3n aunque nadie m\xE1s la comparta.","no necesita que le validen para confiar en lo que ha hecho.","defiende su criterio sin buscar la aprobaci\xF3n de nadie."]}]}]},{nombre:"Polo inestable",familias:[{nombre:"ansiedad",entradas:[{p:"Ansioso",d:"anticipa continuamente lo que puede salir mal.",v:["pregunta cinco veces por algo que ya est\xE1 resuelto.","no puede dejar de mirar el m\xF3vil esperando una respuesta.","se imagina lo peor antes de tener ning\xFAn dato."]},{p:"Aprensivo",d:"teme males concretos, sobre todo da\xF1os y enfermedades.",v:["cualquier molestia f\xEDsica le parece el principio de algo grave.","busca sus s\xEDntomas en internet y ya se ha diagnosticado tres enfermedades.","un ruido raro en el coche le arruina el viaje entero."]},{p:"Inquieto",d:"no puede parar, ni de cuerpo ni de cabeza.",v:["no aguanta sentado toda una comida.","se levanta cinco veces durante una pel\xEDcula.","tamborilea con los dedos mientras espera cualquier cosa."]},{p:"Nervioso",d:"reacciona con tensi\xF3n ante cualquier est\xEDmulo.",v:["se le nota en las manos antes de una reuni\xF3n rutinaria.","le tiembla la voz al hacer una llamada sencilla.","no puede quedarse quieto antes de un examen, aunque se lo sepa."]},{p:"Tenso",d:"vive con el cuerpo y el trato agarrotados.",v:["le cuesta re\xEDrse aunque quiera.","lleva los hombros subidos incluso en un d\xEDa tranquilo.","responde con brusquedad a preguntas normales sin darse cuenta."]}]},{nombre:"inseguridad",entradas:[{p:"Inseguro",d:"duda de su propio valor y de su criterio.",v:["te pide opini\xF3n sobre algo que domina mejor que t\xFA.","cambia lo que ha dicho en cuanto nota una cara de duda.","necesita que le confirmen tres veces que lo ha hecho bien."]},{p:"Indeciso",d:"no consigue elegir.",v:["lleva ocho meses con la misma decisi\xF3n encima de la mesa.","tarda veinte minutos en elegir del men\xFA y aun as\xED duda al pedir.","pide opini\xF3n a cinco personas distintas y no se queda con ninguna."]},{p:"Dubitativo",d:"se lo replantea todo mientras lo dice.",v:["cambia de postura tres veces en la misma frase.","empieza a responder y se corrige a media respuesta.",'dice "bueno, o quiz\xE1s no" despu\xE9s de casi cualquier afirmaci\xF3n.']},{p:"Vacilante",d:"arranca la acci\xF3n y se echa atr\xE1s.",v:["dice que s\xED, y a la hora escribe para matizarlo.","empieza a hacer la mudanza y para a medias para pensarlo otra vez.","acepta el puesto y dos d\xEDas despu\xE9s pregunta si a\xFAn puede rechazarlo."]},{p:"Fr\xE1gil",d:"se rompe con poco.",v:["una cr\xEDtica menor le deja fuera de juego el resto del d\xEDa.","un comentario sin mala intenci\xF3n le hunde el \xE1nimo del d\xEDa.","necesita mucho para volver a estar bien despu\xE9s de un contratiempo peque\xF1o."]}]},{nombre:"descontrol",entradas:[{p:"Irascible",d:"se enciende r\xE1pido y fuerte.",v:["la discusi\xF3n pasa a gritos en menos de un minuto.","basta un comentario torpe para que suba el tono de golpe.","cualquier contratiempo peque\xF1o le hace estallar."]},{p:"Explosivo",d:"acumula en silencio y estalla de golpe.",v:["aguanta tres semanas y revienta por una tonter\xEDa.","no dice nada durante d\xEDas y luego suelta todo de golpe.","la gota que colma el vaso es siempre algo m\xEDnimo."]},{p:"Temperamental",d:"su humor manda sobre su conducta.",v:["el trato que te da depende de c\xF3mo se haya levantado.","un d\xEDa es encantador y al siguiente, sin motivo claro, est\xE1 insoportable.","su reacci\xF3n al mismo comentario cambia seg\xFAn el humor del d\xEDa."]},{p:"Vol\xE1til",d:"cambia de estado emocional sin transici\xF3n.",v:["pasa de la euforia al desplome en la misma tarde.","est\xE1 feliz a mediod\xEDa y por la noche todo le parece un desastre.","cambia de opini\xF3n sobre lo que quiere en cuesti\xF3n de horas."]},{p:"Visceral",d:"reacciona desde la tripa, sin pasar por la cabeza.",v:["responde al mensaje antes de acabar de leerlo.","reacciona con el cuerpo antes de haber entendido lo que ha pasado.","contesta desde el enfado y luego tiene que rectificar."]}]},{nombre:"fondo sombr\xEDo",entradas:[{p:"Melanc\xF3lico",d:"tiene un fondo triste estable, sin causa actual.",v:["est\xE1 bien y aun as\xED hay algo apagado debajo.","una canci\xF3n cualquiera le trae una tristeza que no sabe explicar.","en medio de una buena tarde, se queda callado mirando a ning\xFAn sitio."]},{p:"Pesimista",d:"espera por defecto que salga mal.",v:["ante cualquier plan, su primera frase es el inconveniente.","da por hecho que el proyecto va a salir mal antes de empezarlo.","cuando algo va bien, espera a que se tuerza."]},{p:"Derrotista",d:"da por perdido antes de intentarlo.",v:['ni presenta la oferta porque "total, no nos la van a dar".',"abandona el intento antes de haberlo probado de verdad.","da la partida por perdida en el primer contratiempo."]},{p:"Agorero",d:"anuncia desgracias.",v:["siempre tiene el caso de alguien a quien le fue fatal.","cada plan nuevo le recuerda a alguien a quien le sali\xF3 mal.","anuncia la ruina antes de que nadie haya visto ning\xFAn s\xEDntoma."]},{p:"Victimista",d:"se coloca sistem\xE1ticamente en el papel de perjudicado.",v:["cualquier problema acaba siendo algo que le han hecho a \xE9l.","el tr\xE1fico, el jefe y el tiempo se ponen siempre de acuerdo en su contra.","cuenta la misma an\xE9cdota de injusticia en cada reuni\xF3n distinta."]}]},{nombre:"desconfianza",entradas:[{p:"Receloso",d:"desconf\xEDa sin motivo declarado.",v:["te pregunta tres veces lo mismo con otras palabras.","duda de un favor sin motivo para dudar.","necesita comprobarlo todo dos veces aunque nunca haya fallado nadie."]},{p:"Suspicaz",d:"busca activamente la segunda intenci\xF3n en lo que dices.",v:['le haces un cumplido y responde "\xBFpor qu\xE9 me dices eso?".',"busca la trampa en una oferta que no la tiene.","interpreta cualquier cambio de planes como que le ocultan algo."]},{p:"Desconfiado",d:"parte de la base de que la gente falla.",v:["nunca delega nada de verdad.","revisa el trabajo ajeno aunque nunca le hayan fallado.","pide todo por escrito incluso a quien conoce de toda la vida."]},{p:"Celoso",d:"teme perder a alguien frente a un tercero.",v:["le cambia la cara cuando aparece cierta persona.","pregunta con qui\xE9n ha quedado, otra vez, aunque ya se lo haya dicho.","le incomoda que su pareja tenga un buen amigo por el que siente algo de recelo."]},{p:"Posesivo",d:"trata el v\xEDnculo como propiedad.",v:["le molesta el plan al que no est\xE1 invitado.","quiere saber en todo momento d\xF3nde est\xE1 y con qui\xE9n.","trata como una traici\xF3n que hagas un plan sin contar con \xE9l."]}]}]}]},{n:5,titulo:"Mente y curiosidad",intro:"C\xF3mo funciona su cabeza: qu\xE9 le interesa, c\xF3mo procesa lo nuevo y cu\xE1nta realidad admite que no encaja con lo que ya cree. Ojo: **esta dimensi\xF3n no mide inteligencia**. Hay gente muy lista y muy cerrada, y gente de capacidad normal y muy abierta.",polos:[{nombre:"Polo abierto",familias:[{nombre:"curiosidad",entradas:[{p:"Curioso",d:"quiere saber c\xF3mo funcionan las cosas.",v:["desmonta el aparato averiado aunque ya haya comprado el nuevo.","le pregunta al experto de la fiesta hasta el \xFAltimo detalle de su oficio.","abre el cap\xF3 del coche solo por entender c\xF3mo funciona."]},{p:"Inquieto (intelectualmente)",d:"no se conforma con lo que ya sabe.",v:["se mete en un tema nuevo cada pocos meses.","termina un curso online y ya est\xE1 apuntado al siguiente.","nunca da un tema por agotado del todo."]},{p:"\xC1vido",d:"devora informaci\xF3n con hambre.",v:["se lee la documentaci\xF3n entera, no el resumen.","acaba un libro y ya est\xE1 empezando el siguiente esa misma noche.","pregunta por las fuentes originales en vez de conformarse con el resumen."]}]},{nombre:"agudeza",entradas:[{p:"Agudo",d:"capta r\xE1pido, incluso lo que se dice a medias.",v:["entiende el problema antes de que acabes de explicarlo.","capta la broma un segundo antes que el resto de la mesa.","nota la contradicci\xF3n en el argumento que nadie m\xE1s ha visto."]},{p:"Perspicaz",d:"ve lo que otros no ven, no lo que otros ven m\xE1s lento.",v:["se\xF1ala el detalle que a todos se les hab\xEDa pasado.","ve el motivo real detr\xE1s de una excusa que suena bien.","detecta que algo no encaja antes de tener pruebas de ello."]},{p:"Sagaz",d:"perspicaz **y** pr\xE1ctico: usa lo que ve para anticiparse.",v:["prev\xE9 la maniobra del otro antes de que la haga.","anticipa la objeci\xF3n del cliente y ya lleva la respuesta preparada.","lee la situaci\xF3n y mueve ficha antes de que los dem\xE1s reaccionen."]},{p:"L\xFAcido",d:"ve la situaci\xF3n con claridad, sin enga\xF1arse.",v:["es el \xFAnico que nombra en voz alta lo que todos evitan.","explica lo que est\xE1 pasando con una claridad que corta el ruido.","no se enga\xF1a con lo que quisiera que fuera cierto."]},{p:"Ingenioso",d:"encuentra soluciones o salidas originales.",v:["resuelve con lo que tiene a mano algo que requer\xEDa material.","arregla el problema con una soluci\xF3n que a nadie m\xE1s se le hab\xEDa ocurrido.","convierte una limitaci\xF3n en una ventaja con una idea sencilla."]},{p:"Ocurrente",d:"se le ocurren cosas con gracia y rapidez.",v:["tiene siempre la r\xE9plica justa en el momento justo.","suelta el comentario que resume la situaci\xF3n mejor que un p\xE1rrafo entero.","encuentra la salida graciosa al momento m\xE1s inc\xF3modo."]},{p:"Reflexivo",d:"piensa las cosas antes de opinar.",v:["pide un d\xEDa antes de contestar a algo importante.","deja pasar la primera reacci\xF3n y responde con la segunda, m\xE1s pensada.","prefiere quedarse callado a soltar una opini\xF3n sin haberla masticado."]},{p:"Anal\xEDtico",d:"descompone los problemas en partes.",v:["antes de responder, ordena en voz alta las variables.","descompone el problema grande en tres preguntas manejables.","pide los datos antes de opinar sobre lo que ha pasado."]}]},{nombre:"cultivo y estilo",entradas:[{p:"Culto",d:"tiene conocimiento amplio y lo ha integrado.",v:["relaciona lo que est\xE1s contando con algo de otro campo.","cita sin esfuerzo algo que ley\xF3 hace veinte a\xF1os y que viene al caso.","conecta un problema de hoy con un ejemplo hist\xF3rico que lo explica."]},{p:"Erudito",d:"sabe much\xEDsimo de un terreno concreto.",v:["conoce la excepci\xF3n de la excepci\xF3n.","corrige un dato menor de una pel\xEDcula con una precisi\xF3n que asusta.","sabe m\xE1s sobre su tema que la mayor\xEDa de quienes se dedican a \xE9l."]},{p:"Versado",d:"tiene pr\xE1ctica y conocimiento en una materia.",v:["se maneja en el asunto sin necesitar consultar.","responde a la duda t\xE9cnica sin tener que mirarlo.","lleva tantos a\xF1os en el tema que ya no necesita el manual."]},{p:"Inconformista",d:"no acepta lo establecido por el hecho de estar establecido.",v:['pregunta "\xBFy por qu\xE9 se hace as\xED?" en su primer d\xEDa.',"cuestiona la norma que todos han dado por buena sin pensarlo.",'no acepta un "siempre se ha hecho as\xED" como respuesta.']},{p:"Heterodoxo",d:"se aparta de la doctrina aceptada por convicci\xF3n propia, no por rebeld\xEDa.",v:["defiende en p\xFAblico el m\xE9todo que su gremio da por descartado.","publica una idea que su propio campo mira con recelo.","llega a una conclusi\xF3n distinta a la del resto tras estudiar lo mismo que ellos."]},{p:"Original",d:"piensa por su cuenta y llega a sitios propios.",v:["su propuesta no se parece a ninguna de las de la sala.","resuelve el encargo desde un \xE1ngulo que nadie hab\xEDa planteado.","el regalo que hace no se parece a lo que har\xEDa cualquier otro."]},{p:"Exc\xE9ntrico",d:"se sale de la norma en sus gustos o costumbres, sin buscarlo.",v:["le da igual que le miren raro y ni se ha dado cuenta.","decora la casa con algo que a nadie m\xE1s se le ocurrir\xEDa poner.","tiene una afici\xF3n que nadie de su entorno comparte ni entiende del todo."]},{p:"Refinado",d:"tiene el gusto educado y distingue matices.",v:["nota la diferencia donde los dem\xE1s vemos lo mismo.","distingue matices de sabor que al resto de la mesa se le escapan.","elige los detalles con un gusto que se nota sin ser ostentoso."]}]}]},{nombre:"Polo cerrado",familias:[{nombre:"General",entradas:[{p:"Convencional",d:"se mueve por lo aceptado y no lo cuestiona.",v:['su respuesta a por qu\xE9 es "porque siempre se ha hecho as\xED".',"sigue el camino esperado en cada decisi\xF3n importante de su vida.","elige siempre la opci\xF3n que nadie va a cuestionar."]},{p:"Rutinario",d:"vive en lo repetido y evita lo nuevo.",v:["lleva doce a\xF1os pidiendo el mismo plato en el mismo sitio.","hace exactamente el mismo recorrido de vacaciones cada a\xF1o.","se resiste a probar el restaurante nuevo porque ya tiene el suyo."]},{p:"Prosaico",d:"solo valora lo pr\xE1ctico e inmediato.",v:["lo que no tiene utilidad directa le parece una tonter\xEDa.","no entiende para qu\xE9 sirve ir a un museo si no aprendes un oficio.","valora un regalo solo por lo que le va a servir."]},{p:"Dogm\xE1tico",d:"sus opiniones no admiten revisi\xF3n: son verdades.",v:['no dice "yo creo", dice "es as\xED".',"presenta su opini\xF3n como un hecho que no admite discusi\xF3n.","no distingue entre lo que sabe y lo que solo cree."]},{p:"Intransigente",d:"no cede ni un mil\xEDmetro ante otra postura.",v:["rechaza el punto intermedio aunque le beneficie.","no acepta ni un peque\xF1o cambio en su manera de hacer las cosas.","prefiere que el trato se rompa antes que ceder un mil\xEDmetro."]},{p:"Obcecado",d:"se ha cerrado en una idea y ya no procesa nada que la contradiga.",v:["le ense\xF1as la prueba y busca por qu\xE9 la prueba est\xE1 mal.","sigue defendiendo la ruta equivocada con el mapa delante.","no hay dato que le haga cambiar de idea una vez decidida."]},{p:"Cerril",d:"cerrado por bruto, no por convicci\xF3n.",v:["ni siquiera escucha el argumento entero.","corta la explicaci\xF3n a la mitad porque ya ha decidido que no.","responde que no antes de haber entendido la pregunta."]},{p:"Obtuso",d:"no llega a entender, por lentitud o por estrechez.",v:["se lo has explicado de cuatro maneras y sigue en la primera.","no capta la indirecta aunque se la digan casi de frente.","necesita que le repitan lo mismo varias veces para que le cale."]},{p:"Sectario",d:"solo admite lo que viene de los suyos.",v:["el mismo argumento le vale o no seg\xFAn qui\xE9n lo diga.","descarta la idea en cuanto sabe de qu\xE9 lado viene.","aplaude en unos lo que critica exactamente igual en otros."]},{p:"Prejuicioso",d:"juzga por la categor\xEDa, no por la persona.",v:["ya sabe c\xF3mo es alguien antes de cruzar una palabra.","juzga la capacidad de alguien por su acento antes de o\xEDrle argumentar.","espera lo peor de un grupo entero por la fama de unos pocos."]},{p:"Cr\xE9dulo",d:"se cree lo que le cuentan sin filtrar.",v:["reenv\xEDa cualquier cosa que le llega.","se cree el bulo antes de comprobar la fuente.","compra lo que le prometen sin hacer ni una pregunta."]},{p:"Ingenuo",d:"no ve la malicia ajena. **No es tonto**: es que no la busca.",v:["le enga\xF1an y sigue pensando que fue un malentendido.","presta dinero a quien ya le ha fallado antes, convencido de que esta vez s\xED.","no ve venir la trampa que a cualquiera le habr\xEDa saltado a la vista."]},{p:"C\xE1ndido",d:"ingenuo con un punto de pureza; ni concibe el enga\xF1o.",v:["se sorprende sinceramente de que alguien mienta.","no concibe que alguien le haga da\xF1o a prop\xF3sito.","cree la excusa m\xE1s inveros\xEDmil porque no se le ocurre que se la inventen."]}]}]}]},{n:6,titulo:"Honestidad y ego",intro:"Si va de frente o va a lo suyo, y cu\xE1nto sitio ocupa su propia imagen. Es la dimensi\xF3n decisiva: puedes convivir con alguien desordenado, t\xEDmido o nervioso, pero no con alguien de quien no te f\xEDas. Tambi\xE9n es donde m\xE1s se falla al elegir la palabra, porque hay quince t\xE9rminos parecidos y cada uno significa algo distinto.",polos:[{nombre:"Polo \xEDntegro",familias:[{nombre:"fondo moral",entradas:[{p:"\xCDntegro",d:"sus actos coinciden con lo que dice creer, tambi\xE9n cuando nadie mira.",v:["devuelve el dinero de m\xE1s sin que nadie lo hubiera notado.","hace lo correcto aunque salir perdiendo con ello sea evidente.","cumple la promesa aunque las circunstancias que la motivaron ya hayan cambiado."]},{p:"Honrado",d:"no toma lo que no le corresponde.",v:["factura las horas que ha hecho, no las que podr\xEDa colar.","devuelve la cartera con todo el dinero dentro.","avisa del defecto del producto que est\xE1 vendiendo, aunque baje la venta."]},{p:"Recto",d:"no se desv\xEDa de lo que considera correcto, ni por presi\xF3n ni por inter\xE9s.",v:["pierde el cliente antes que firmar algo que no se ajusta a norma.","aplica la misma regla a su propio hijo que al resto.","no se salta el procedimiento aunque le suponga perder tiempo."]},{p:"Cabal",d:"persona completa y de juicio sensato; de una pieza.",v:["todo el mundo que le conoce dice exactamente lo mismo de \xE9l.","es la misma persona en la reuni\xF3n que en la barra del bar.","su palabra pesa lo mismo diez a\xF1os despu\xE9s de dada."]},{p:"Sensato",d:"toma decisiones razonables; ni exagera ni se deja llevar por el impulso del momento.",v:["cuando todos se alteran por una tonter\xEDa, es quien dice \xABpensemos esto con calma\xBB \u2014 y acierta.","propone la opci\xF3n menos vistosa pero la que de verdad funciona.","no se deja llevar por el entusiasmo del grupo si los n\xFAmeros no cuadran."]},{p:"Decente",d:"cumple lo m\xEDnimo que se le debe a los dem\xE1s.",v:["avisa al vecino antes de empezar la obra.","paga lo que debe aunque nadie fuera a reclam\xE1rselo.","trata con respeto incluso a quien no se lo ha ganado."]},{p:"Justo",d:"da a cada uno lo suyo.",v:["reparte el m\xE9rito incluyendo al que no estaba delante.","da la raz\xF3n a quien la tiene, sea de su equipo o no.","aplica el mismo criterio para premiar y para corregir a todos por igual."]},{p:"Leal",d:"sostiene el v\xEDnculo cuando cuesta.",v:["no se apunta a criticarte cuando no est\xE1s.","defiende tu decisi\xF3n delante de otros aunque en privado no la comparta del todo.","sigue a tu lado cuando ya no le trae ning\xFAn beneficio."]}]},{nombre:"transparencia",entradas:[{p:"Sincero",d:"dice lo que piensa.",v:["responde a lo que le has preguntado de verdad.","dice que no le ha gustado el plato en vez de fingir que s\xED.","no disimula lo que opina solo por quedar bien."]},{p:"Franco",d:"dice lo que piensa **aunque incomode**.",v:["te dice que la idea no es buena delante de todos.","responde con la verdad aunque sepa que va a doler.","no suaviza la cr\xEDtica hasta vaciarla de contenido."]},{p:"Directo",d:"va al asunto sin rodeos.",v:["la conversaci\xF3n dura tres minutos y queda todo claro.","va al grano en el correo, sin rodeos antes de la petici\xF3n.","dice qu\xE9 quiere en vez de dar vueltas para que se lo adivinen."]},{p:"Transparente",d:"no oculta ni sus intenciones ni sus intereses.",v:["dice de entrada qu\xE9 gana \xE9l con esto.","cuenta c\xF3mo se ha tomado la decisi\xF3n, no solo el resultado.","no oculta el motivo real por el que propone el cambio."]}]},{nombre:"humildad",entradas:[{p:"Humilde",d:"conoce su valor y no necesita exhibirlo.",v:["sabe m\xE1s que nadie en la sala y deja hablar a los dem\xE1s.","no menciona el premio que gan\xF3 a menos que se lo pregunten.","escucha la opini\xF3n de un principiante con el mismo respeto que la de un experto."]},{p:"Modesto",d:"quita importancia a sus propios m\xE9ritos.",v:["le felicitan y desv\xEDa el m\xE9rito al equipo, y es verdad.","resta importancia al logro que a otro le habr\xEDa dado para presumir un a\xF1o.","prefiere que el m\xE9rito se reparta antes que qued\xE1rselo entero."]},{p:"Sencillo",d:"no se rodea de aparato ni de distancia.",v:["tiene un cargo importante y no lo mencionar\xEDa jam\xE1s.","viste y vive igual antes y despu\xE9s de que le fuera bien.","no necesita que nadie sepa lo que ha conseguido para sentirse bien."]},{p:"Autocr\xEDtico",d:"se examina a s\xED mismo con el mismo rasero que a los dem\xE1s.",v:["es el primero en decir en qu\xE9 se equivoc\xF3.","revisa su propia parte del fallo antes de mirar la de los dem\xE1s.","acepta la correcci\xF3n sin ponerse a la defensiva."]},{p:"Agradecido",d:"reconoce lo que recibe.",v:["se acuerda un a\xF1o despu\xE9s del favor que le hiciste.","menciona en p\xFAblico a quien le ayud\xF3 a llegar donde est\xE1.","responde al detalle con otro, aunque haya pasado tiempo."]},{p:"Desinteresado",d:"act\xFAa sin buscar retorno.",v:["ayuda igual al que nunca podr\xE1 devolv\xE9rselo.","hace el favor sin preguntarse qu\xE9 saca \xE9l a cambio.","da su tiempo a quien no puede ofrecerle nada \xFAtil."]}]}]},{nombre:"Polo interesado",familias:[{nombre:"el ego (el grupo m\xE1s confundido de toda la gu\xEDa)",entradas:[{p:"Soberbio",d:"se sobrevalora a s\xED mismo. El foco est\xE1 en c\xF3mo se ve por dentro.",v:["no admite un error ni con la prueba delante.","cree que las reglas que aplican a los dem\xE1s no son para \xE9l.","no pide perd\xF3n porque, en el fondo, cree que nunca se equivoca."]},{p:"Arrogante",d:"exige el trato que cree merecer. El foco est\xE1 en lo que reclama.",v:["se molesta porque no le han consultado a \xE9l primero.","exige un trato especial que nadie m\xE1s recibe.","da por hecho que su opini\xF3n pesa m\xE1s que la de cualquiera en la sala."]},{p:"Altivo",d:"marca distancia hacia abajo. El foco est\xE1 en la separaci\xF3n.",v:["no se sienta en esa mesa.","responde a un saludo con la m\xEDnima educaci\xF3n posible.","deja claro con el gesto que est\xE1 por encima de la conversaci\xF3n."]},{p:"Altanero",d:"mira por encima del hombro; altivo con desd\xE9n visible.",v:["te contesta sin girar del todo la cabeza.","mira el reloj mientras le hablas, como si perdiera el tiempo.","responde con un monos\xEDlabo a quien considera que no est\xE1 a su altura."]},{p:"Engre\xEDdo",d:"se recrea en s\xED mismo, encantado de conocerse.",v:["cuenta la misma an\xE9cdota suya por tercera vez.","se r\xEDe de sus propios chistes antes de que nadie m\xE1s lo haga.","no se cansa de recordar lo bien que se le da algo."]},{p:"Vanidoso",d:"necesita ser admirado, sobre todo por su imagen.",v:["mira si le has visto hacer lo que acaba de hacer.","revisa c\xF3mo sale en cada foto antes de que la suban.","necesita el cumplido de todos, no le basta con el suyo propio."]},{p:"Presuntuoso",d:"presume de lo que tiene o cree tener.",v:["mete el precio de las cosas en la conversaci\xF3n.","menciona sin que venga a cuento con qui\xE9n ha comido esta semana.","deja caer el nombre del sitio caro donde estuvo de vacaciones."]},{p:"Fanfarr\xF3n",d:"exagera o inventa m\xE9ritos para impresionar.",v:["todas sus an\xE9cdotas acaban con \xE9l quedando por encima.","cuenta una haza\xF1a que, mirada de cerca, no cuadra del todo.","exagera el m\xE9rito de algo que en realidad hizo otra persona con \xE9l."]},{p:"Petulante",d:"exhibe con afectaci\xF3n y sin venir a cuento.",v:["suelta el dato culto que no aporta nada al tema.","corrige a alguien en p\xFAblico por algo que no cambia nada.","presume de un conocimiento que nadie le ha pedido."]},{p:"Pedante",d:"exhibe espec\xEDficamente **saber**, para marcar nivel.",v:["corrige tu terminolog\xEDa en vez de responder a tu pregunta.","usa la palabra rebuscada donde la sencilla habr\xEDa bastado.","convierte una charla informal en una clase magistral que nadie pidi\xF3."]},{p:"Prepotente",d:"impone porque cree que puede.",v:['zanja con "esto se hace as\xED y punto".',"ignora la objeci\xF3n de un compa\xF1ero porque cree que no est\xE1 a su nivel.","impone su decisi\xF3n sin molestarse en justificarla."]},{p:"Condescendiente",d:"te trata como inferior **siendo amable**. Ah\xED est\xE1 el veneno: la forma es correcta y el fondo te rebaja.",v:['dice "claro, t\xFA no tienes por qu\xE9 saberlo" con buen tono.',"explica algo sencillo con un tono de quien habla con un ni\xF1o.","felicita el esfuerzo con un matiz de sorpresa, como si no lo esperara."]},{p:"Paternalista",d:"decide por tu bien sin pedirte permiso.",v:['te oculta informaci\xF3n "para no preocuparte".',"decide por ti lo que es mejor sin preguntarte qu\xE9 prefieres.","te protege de una decisi\xF3n que era tuya tomar."]},{p:"Egoc\xE9ntrico",d:"todo lo refiere a s\xED mismo.",v:["le cuentas un problema tuyo y acaba hablando del suyo.","convierte cualquier conversaci\xF3n en un tema sobre s\xED mismo.","interpreta cada situaci\xF3n por c\xF3mo le afecta a \xE9l."]},{p:"Eg\xF3latra",d:"se adora abiertamente.",v:["su conversaci\xF3n entera es su propia biograf\xEDa.","no se cansa de hablar de s\xED mismo ni una sola vez en toda la cena.","cuelga en redes cada peque\xF1o logro suyo, varias veces al d\xEDa."]},{p:"Narcisista",d:"necesita admiraci\xF3n constante, se cree con derechos especiales y no registra el da\xF1o que hace. Es un **t\xE9rmino cl\xEDnico**: \xFAsalo para el patr\xF3n completo y estable, no como sin\xF3nimo elegante de ego\xEDsta.",v:["el patr\xF3n se repite durante a\xF1os, en todos sus v\xEDnculos, y siempre acaba con el otro pidiendo perd\xF3n.","necesita admiraci\xF3n constante y se enfada si no la recibe.","no registra el da\xF1o que causa aunque se lo digan varias personas distintas."]}]},{nombre:"el inter\xE9s",entradas:[{p:"Ego\xEDsta",d:"antepone lo suyo.",v:["reparte de forma que a \xE9l le toque lo mejor, siempre.","decide el plan pensando solo en lo que le apetece a \xE9l.","no cede ni cuando ceder le costar\xEDa casi nada."]},{p:"Interesado",d:"se acerca en funci\xF3n de lo que puede sacar.",v:["aparece justo cuando necesita algo y desaparece despu\xE9s.","se acerca a quien puede serle \xFAtil y se aleja de quien no.","su amabilidad sube justo antes de pedirte un favor."]},{p:"Utilitario",d:"trata a las personas como medios.",v:["clasifica a la gente por lo que le pueden resolver.","mantiene el contacto solo mientras le sea \xFAtil.","valora una amistad por lo que le aporta, no por lo que es."]},{p:"Mercenario",d:"solo se implica mientras cobra, y el cobro puede ser afectivo y no material.",v:["su inter\xE9s se apaga el d\xEDa exacto en que deja de recibir.","solo aparece por el proyecto mientras hay algo que ganar en \xE9l.","su entusiasmo dura lo mismo que dura el beneficio."]},{p:"Oportunista",d:"aprovecha la coyuntura sin compromiso previo.",v:["se arrima al proyecto justo cuando empieza a salir bien.","aparece a \xFAltima hora a reclamar parte del m\xE9rito.","cambia de bando en cuanto ve qui\xE9n va ganando."]},{p:"Ventajista",d:"busca sacar m\xE1s de lo que aporta.",v:["siempre pone la parte m\xE1s peque\xF1a y cobra la m\xE1s grande.","elige primero y deja para el resto lo que sobra.","negocia para que el riesgo sea tuyo y el beneficio suyo."]},{p:"Aprovechado",d:"se instala en el esfuerzo ajeno.",v:["nunca le toca pagar y siempre hay un motivo.","usa el coche, la casa o el tiempo ajeno como si fuera suyo.","deja que otros hagan el trabajo pesado y \xE9l firma el resultado."]},{p:"Arribista",d:"trepa socialmente sin escr\xFApulos sobre los medios.",v:["cambia de amistades cada vez que sube de puesto.","deja de hablar a quien ya no le sirve para subir.","se acerca al que manda en cuanto detecta que puede ascender."]},{p:"Calculador",d:"mide constantemente coste y beneficio de cada relaci\xF3n.",v:["su simpat\xEDa sube y baja seg\xFAn qui\xE9n est\xE9 delante.","mide cada gesto por lo que le puede devolver a cambio.","decide con qui\xE9n ser amable seg\xFAn lo que esa persona pueda ofrecerle."]},{p:"Transaccional",d:"entiende los v\xEDnculos como un intercambio con marcador.",v:["te recuerda lo que hizo por ti cuando quiere algo.","lleva la cuenta de qui\xE9n le debe un favor.","ayuda con la expectativa clara de que se lo devuelvan."]},{p:"Mezquino",d:"ruin en lo que da y en lo que reconoce. No es solo taca\xF1o: es peque\xF1o de esp\xEDritu.",v:["le regatea el m\xE9rito a alguien que se lo ha ganado.","hace un comentario que resta valor al logro ajeno, sin necesidad.","da lo m\xEDnimo posible aunque le sobre de sobra."]},{p:"Codicioso",d:"quiere m\xE1s, siempre.",v:["gana lo que quer\xEDa y al d\xEDa siguiente ya quer\xEDa otra cosa.","nunca considera que ya tiene suficiente.","quiere una parte mayor incluso cuando la suya ya es generosa."]},{p:"Taca\xF1o",d:"le duele gastar.",v:["calcula al c\xE9ntimo su parte de la cuenta.","no deja propina ni cuando el servicio ha sido excelente.","discute el precio de algo que cuesta casi nada."]},{p:"Ingrato",d:"no reconoce lo recibido.",v:["le sacas de un apuro y a la semana ni se menciona.","olvida qui\xE9n le ayud\xF3 en cuanto deja de necesitarlo.","no reconoce el esfuerzo ajeno aunque le haya salvado el proyecto."]}]},{nombre:"el enga\xF1o",entradas:[{p:"Mentiroso",d:"falta a la verdad.",v:["dos versiones suyas no encajan y no le importa.","cuenta que estaba en un sitio cuando estaba en otro, sin necesidad.","inventa un motivo cuando el real era perfectamente aceptable."]},{p:"Embustero",d:"miente por costumbre, incluso sin necesidad.",v:["miente en cosas que no le aportan nada.","se inventa un detalle solo para hacer la historia m\xE1s interesante.","miente por costumbre incluso cuando decir la verdad ser\xEDa m\xE1s f\xE1cil."]},{p:"Falso",d:"muestra un afecto que no tiene.",v:["te trata de maravilla y luego te destroza en cuanto sales.","te sonr\xEDe a la cara y habla mal de ti en cuanto te vas.","finge alegrarse por tu \xE9xito mientras por dentro le molesta."]},{p:"Hip\xF3crita",d:"exige a los dem\xE1s lo que \xE9l no cumple.",v:["critica exactamente lo que hizo el mes pasado.","exige puntualidad y llega tarde \xE9l mismo cada semana.","predica la honestidad y maquilla sus propios n\xFAmeros."]},{p:"Farsante",d:"sostiene un personaje entero que no es \xE9l.",v:["descubres que su curr\xEDculum no era ni parecido.","presume de un t\xEDtulo que nunca termin\xF3.","mantiene una imagen que no se sostiene si rascas un poco."]},{p:"C\xEDnico",d:"hace o dice lo indebido **sin ocultarlo y sin verg\xFCenza**.",v:["reconoce abiertamente que le da igual y se queda tan tranquilo.","admite que hizo trampa y no ve el problema.","dice sin ning\xFAn pudor que har\xE1 lo que m\xE1s le convenga."]},{p:"Desvergonzado",d:"act\xFAa mal sin pudor y sin molestarse en disimular.",v:["le pillan en falta y se r\xEDe.","pide un favor a quien acaba de perjudicar, sin inmutarse.","reclama algo que no le corresponde con total naturalidad."]},{p:"Adulador",d:"halaga para obtener algo.",v:["sus elogios llegan siempre unos minutos antes de la petici\xF3n.","alaba la idea del jefe justo antes de pedirle un favor.","reparte cumplidos que no cuadran con lo que dice en privado."]},{p:"Zalamero",d:"halaga con empalago y familiaridad excesiva.",v:['te toca el hombro y te llama "campe\xF3n".',"empieza cada frase con un halago de m\xE1s.","se acerca con una confianza que no se ha ganado todav\xEDa."]},{p:"Manipulador",d:"orienta a otros hacia lo que \xE9l quiere sin que lo vean.",v:["acabas haciendo algo que no quer\xEDas y no sabes en qu\xE9 momento decidiste.","te hace sentir culpable hasta que cedes.","cuenta la mitad de la historia para que saques la conclusi\xF3n que le interesa."]},{p:"Taimado",d:"astuto y disimulado; esconde lo que trama.",v:["te enteras de sus movimientos cuando ya est\xE1n hechos.","prepara la jugada sin que nadie note que la est\xE1 preparando.","act\xFAa con una cara mientras trama otra cosa por dentro."]},{p:"Ladino",d:"astuto para su provecho, con un punto de bajeza.",v:["usa una cl\xE1usula que sab\xEDa que no hab\xEDas le\xEDdo.","se aprovecha de un vac\xEDo legal que conoce mejor que nadie.","consigue lo que quiere por un camino que t\xFA ni hab\xEDas visto."]},{p:"Retorcido",d:"hace las cosas por caminos indirectos e innecesarios.",v:["pod\xEDa haberlo pedido y mont\xF3 una situaci\xF3n para conseguirlo.","complica algo simple para sacar una ventaja que de frente no conseguir\xEDa.","encuentra la vuelta m\xE1s enrevesada para llegar a lo mismo."]},{p:"Maquiav\xE9lico",d:"usa a las personas como piezas dentro de una estrategia fr\xEDa y sostenida.",v:["enfrenta a dos personas y se queda con el resultado de ambas.","planea varios pasos por delante, sin que nadie note la estrategia.","usa la debilidad de cada uno para moverlos a su favor."]},{p:"Desleal",d:"rompe el v\xEDnculo cuando le conviene.",v:["cuenta lo que le confiaste a quien no deb\xEDa.","se pasa a la competencia con la cartera de clientes que t\xFA le diste.","rompe el acuerdo en cuanto le sale algo mejor."]}]}]}]},{n:7,titulo:"C\xF3mo se comporta en un conflicto",intro:"Una discusi\xF3n de veinte minutos ense\xF1a m\xE1s de una persona que seis meses de trato cordial. Aqu\xED no describimos un rasgo nuevo: describimos d\xF3nde se hacen visibles todos los anteriores.",polos:[{nombre:"Los cuatro estilos base",familias:[{nombre:"General",entradas:[{p:"Asertivo",d:"dice lo que quiere, con claridad, sin atacar al otro.",v:['dice "no me va bien y te propongo esto otro", sin subir el tono ni pedir perd\xF3n.',"expone su postura y escucha la del otro sin ceder solo por evitar el roce.","pide lo que necesita sin rodeos y sin atacar a quien tiene delante."]},{p:"Agresivo",d:"impone lo suyo pasando por encima del otro.",v:["sube la voz, interrumpe y personaliza.","gana la discusi\xF3n a base de no dejar hablar al otro.","convierte un desacuerdo en un ataque a la persona."]},{p:"Pasivo",d:"no dice lo que quiere y traga.",v:["acepta y luego se queja con un tercero.","dice que s\xED en la reuni\xF3n y por dentro no est\xE1 de acuerdo con nada.","traga con la decisi\xF3n que no le gusta en vez de decirlo a tiempo."]},{p:"Pasivo-agresivo",d:"no dice lo que quiere pero lo cobra por debajo.",v:['dice "t\xFA haz lo que quieras" y luego lo hace todo mal a prop\xF3sito, o con retraso, o en silencio durante tres d\xEDas.',"responde con monos\xEDlabos varios d\xEDas despu\xE9s de un desacuerdo que nunca verbaliz\xF3.","cumple la tarea a medias, justo lo suficiente para no poder decir que se neg\xF3."]}]}]},{nombre:"Polo dialogante",familias:[{nombre:"General",entradas:[{p:"Dialogante",d:"busca entender antes de responder.",v:["te repite tu argumento con sus palabras antes de rebatirlo.",'pregunta "\xBFqu\xE9 es lo que m\xE1s te preocupa de esto?" antes de defender su postura.',"busca entender el motivo detr\xE1s del desacuerdo, no solo ganarlo."]},{p:"Receptivo",d:"deja que le cambien de opini\xF3n.",v:['dice "no lo hab\xEDa visto as\xED" y de verdad se mueve.',"cambia de idea a media discusi\xF3n cuando el argumento del otro es mejor.","pide el dato que le falta en vez de aferrarse a lo que ya pensaba."]},{p:"Conciliador",d:"busca el terreno com\xFAn.",v:["propone el punto en el que ambos gan\xE1is algo.","busca la salida que deje a los dos razonablemente contentos.","no necesita tener toda la raz\xF3n, le basta con llegar a un acuerdo."]},{p:"Ecu\xE1nime en la discusi\xF3n",d:"aplica el mismo criterio a su error y al tuyo.",v:["reconoce lo que le corresponde sin condicionarlo a que t\xFA reconozcas lo tuyo.","admite su parte del error aunque el otro no admita la suya.","valora el argumento por lo que dice, no por qui\xE9n lo ha dicho."]},{p:"Vehemente",d:"defiende con pasi\xF3n e intensidad, pero argumentando.",v:["se le enciende la voz y aun as\xED todo lo que dice son razones.","defiende su postura con pasi\xF3n pero sin dejar de argumentar.","se nota que le importa, pero no pierde el hilo del argumento por ello."]}]}]},{nombre:"Polo cerrado en banda",familias:[{nombre:"no ceder",entradas:[{p:"Terco",d:"se aferra a su postura.",v:["repite el mismo argumento por cuarta vez, m\xE1s alto.","no cambia de postura ni cuando ya no le quedan argumentos nuevos.","sigue insistiendo en lo mismo aunque la conversaci\xF3n ya est\xE9 agotada."]},{p:"Testarudo / cabezota / tozudo",d:"mismas ideas, registro coloquial y matiz de dureza.",v:["lleva dos horas defendiendo algo que ya sabe que es mentira.","no da su brazo a torcer ni con la evidencia delante.","prefiere perder la discusi\xF3n entera antes que ceder en un punto."]},{p:"Obstinado",d:"persiste con voluntad firme. Es el t\xE9rmino neutro del grupo: puede ser vicio o virtud seg\xFAn el objeto.",v:["insiste tres a\xF1os hasta conseguir lo que quer\xEDa.","vuelve a intentarlo de la misma manera aunque ya haya fallado varias veces.","no suelta el objetivo aunque el camino se complique."]},{p:"Contumaz",d:"reincide en el mismo error o en la misma postura pese a todo.",v:["le ha salido mal cuatro veces y va a por la quinta igual.","repite el mismo error de trato despu\xE9s de que se lo hayan se\xF1alado varias veces.","vuelve a la misma postura en cada discusi\xF3n, aunque ya se la hayan rebatido antes."]},{p:"Porfiado",d:"discute sin parar, por discutir.",v:["le das la raz\xF3n y sigue argumentando.","sigue discutiendo un punto que ya nadie m\xE1s est\xE1 discutiendo.","necesita tener la \xFAltima palabra aunque el tema ya est\xE9 cerrado."]}]},{nombre:"distorsionar",entradas:[{p:"Tergiversador",d:"toma hechos reales y les cambia el orden, el contexto o el \xE9nfasis.",v:["cuenta lo que pas\xF3 y todo es verdad salvo el significado.","cambia el orden de los hechos para que la culpa recaiga en otro.","cita tus palabras fuera de contexto para que digan lo contrario."]},{p:"Negacionista",d:"niega hechos que ocurrieron.",v:['dice "yo eso no lo he dicho nunca" sobre algo de hace dos d\xEDas.',"niega una conversaci\xF3n que hubo testigos delante.","sostiene que algo no pas\xF3 as\xED aunque haya pruebas de lo contrario."]},{p:"Fabulador",d:"construye una narraci\xF3n paralela y se la cree.",v:["su versi\xF3n tiene detalles que no existieron.","a\xF1ade un detalle nuevo cada vez que cuenta la misma historia.","recuerda una discusi\xF3n de un modo que le deja mucho mejor de lo que fue."]},{p:"Proyectivo",d:"te acusa exactamente de lo que \xE9l est\xE1 haciendo.",v:["te dice que est\xE1s cambiando la versi\xF3n mientras la cambia.","te acusa de estar a la defensiva justo cuando el que ataca es \xE9l.","te llama exagerado mientras \xE9l mismo exagera la situaci\xF3n."]},{p:"Evasivo",d:"desv\xEDa en lugar de responder.",v:["preguntas por A y te responde con tus fallos en B.","cambia de tema en cuanto la pregunta se pone inc\xF3moda.","responde con generalidades a una pregunta muy concreta."]},{p:"Escurridizo",d:"nunca acaba de comprometerse con una posici\xF3n.",v:["despu\xE9s de una hora no sabr\xEDas decir qu\xE9 opina.","nunca dice ni s\xED ni no del todo, para poder salir por cualquier lado despu\xE9s.","se compromete con frases que luego puede interpretar de varias formas."]}]},{nombre:"herir para ganar",entradas:[{p:"Beligerante",d:"entra a la discusi\xF3n como a una guerra.",v:["su primera frase ya es un ataque.","entra en la reuni\xF3n buscando ya con qui\xE9n chocar.","convierte una simple diferencia de opini\xF3n en una batalla."]},{p:"Descalificador",d:"ataca a la persona en lugar del argumento.",v:['responde con "es que t\xFA siempre igual" en vez de con una raz\xF3n.',"en vez de rebatir el argumento, dice que quien lo dice no tiene ni idea.","reduce tu punto de vista a un rasgo tuyo negativo, en vez de discutirlo."]},{p:"Despreciativo",d:"trata al otro como no merecedor de
