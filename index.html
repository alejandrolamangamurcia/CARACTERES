v-2a4 4 0 0 0-3-3.87",key:"kshegd"}],["path",{d:"M16 3.13a4 4 0 0 1 0 7.75",key:"1da9ce"}]]);var fa=N("X",[["path",{d:"M18 6 6 18",key:"1bl5f8"}],["path",{d:"m6 6 12 12",key:"d8bk6v"}]]);var n=ut($s()),Gt={dims:[{n:1,titulo:"Energ\xEDa social",intro:"Cu\xE1nta estimulaci\xF3n social necesita una persona para estar a gusto, y cu\xE1nto espacio ocupa cuando est\xE1 con otros. Es lo primero que se percibe de alguien y tambi\xE9n lo que m\xE1s se malinterpreta.",polos:[{nombre:"Polo expansivo",familias:[{nombre:"empuje social",entradas:[{p:"Extrovertido",d:"se recarga estando con gente; la soledad prolongada le apaga.",v:"sale de una comida de ocho personas con m\xE1s energ\xEDa de la que entr\xF3."},{p:"Sociable",d:"busca y disfruta el trato, se relaciona con facilidad.",v:"a los diez minutos en un sitio nuevo ya est\xE1 hablando con alguien."},{p:"Expansivo",d:"se expresa con amplitud: gesticula, alza la voz, ocupa sitio.",v:"se le oye desde la otra punta del bar sin que est\xE9 gritando."},{p:"Efusivo",d:"expresa el afecto y el entusiasmo sin filtro ni contenci\xF3n.",v:"te abraza al saludarte aunque hay\xE1is quedado dos veces en la vida."},{p:"Campechano",d:"trata a todo el mundo con llaneza, sin marcar rango ni distancia.",v:"tutea al jefe y al camarero exactamente igual."},{p:"Locuaz",d:"habla mucho y con facilidad. Neutro: describe fluidez, no exceso.",v:"le preguntas algo de s\xED o no y te da tres minutos."},{p:"Dicharachero",d:"habla con gracia y soltura; anima la conversaci\xF3n.",v:"la mesa se r\xEDe cada vez que toma la palabra."},{p:"Parlanch\xEDn",d:"habla mucho, con matiz de exceso y de poco fondo.",v:"llevas veinte minutos oy\xE9ndole y no te ha preguntado nada."},{p:"Verborreico",d:"habla en avalancha, sin filtro y sin dejar hueco.",v:"haces una pregunta de treinta segundos y la respuesta dura diez minutos."},{p:"Avasallador",d:"su energ\xEDa no deja hueco a los dem\xE1s.",v:"nadie m\xE1s ha conseguido terminar una frase en toda la cena."},{p:"Histri\xF3nico",d:"busca ser el centro con dramatismo y teatralidad.",v:"cuenta un pinchazo de rueda como si hubiera sobrevivido a un accidente."}]},{nombre:"iniciativa y empuje",entradas:[{p:"Resuelto",d:"se decide r\xE1pido y act\xFAa sin darle vueltas.",v:"mientras los dem\xE1s debaten, ya ha llamado y lo ha resuelto."},{p:"Emprendedor",d:"arranca cosas por su cuenta.",v:"tiene dos proyectos en marcha adem\xE1s de su trabajo."},{p:"Lanzado",d:"se mete en situaciones sociales sin c\xE1lculo previo.",v:"se presenta \xE9l solo a la mesa que no conoce."},{p:"Audaz",d:"asume riesgos calculados que otros no asumir\xEDan.",v:"pide el aumento con los n\xFAmeros delante y sin rodeos."},{p:"Temerario",d:"asume riesgos sin calcular. Es el exceso de *audaz*.",v:'firma la reforma sin presupuesto porque "ya se ver\xE1".'},{p:"Asertivo",d:"defiende lo suyo con claridad sin pisar al otro.",v:'dice "esto no me va bien" sin enfadarse ni pedir perd\xF3n.'},{p:"Dominante",d:"tiende a llevar el mando del grupo de forma natural.",v:"nadie le ha nombrado nada y todos esperan a que \xE9l decida."},{p:"Mand\xF3n",d:"da \xF3rdenes sin tener autoridad para ello.",v:"organiza tu cocina cuando viene a cenar a tu casa."}]}]},{nombre:"Polo reservado",familias:[{nombre:"General",entradas:[{p:"Introvertido",d:"se recarga en soledad. **No significa t\xEDmido**: puede ser un excelente conversador y aun as\xED necesitar irse pronto.",v:"despu\xE9s de un d\xEDa social intenso necesita dos horas solo para recuperarse."},{p:"T\xEDmido",d:"quiere el contacto pero le da apuro. El introvertido no lo necesita; el t\xEDmido s\xED lo quiere y no puede.",v:"se le ve rondando el grupo sin acabar de entrar."},{p:"Retra\xEDdo",d:"se aparta de los dem\xE1s, de forma habitual y sin conflicto.",v:"en las comidas de empresa se sienta en la punta y no se mueve."},{p:"Reservado",d:"trata con normalidad pero no cuenta lo suyo.",v:"llevas tres a\xF1os trabajando con \xE9l y no sabes si tiene hijos."},{p:"Discreto",d:"sabe qu\xE9 se calla y cu\xE1ndo. Es la versi\xF3n virtuosa de reservado.",v:"le cuentas algo delicado y sabes que ah\xED muere."},{p:"Herm\xE9tico",d:"no deja ver absolutamente nada, ni siquiera lo que siente.",v:"le dan una mala noticia y su cara no cambia."},{p:"Taciturno",d:"callado y de fondo sombr\xEDo. No es solo silencio: es silencio con peso.",v:"est\xE1 en la mesa y su silencio se nota."},{p:"Hura\xF1o",d:"reh\xFAye el trato y adem\xE1s lo hace con aspereza.",v:"contesta con monos\xEDlabos para que le dejes en paz."},{p:"Esquivo",d:"evita el contacto sin llegar a negarse abiertamente.",v:"siempre tiene un plan justo el d\xEDa que qued\xE1is."},{p:"Solitario",d:"est\xE1 a gusto solo y organiza su vida para estarlo.",v:"se va de viaje solo por gusto, no por falta de compa\xF1\xEDa."}]}]}]},{n:2,titulo:"Trato con los dem\xE1s",intro:"C\xF3mo trata a la gente cuando no gana nada con ello. Es la dimensi\xF3n que mejor predice si convivir con alguien resulta agradable.",polos:[{nombre:"Polo c\xE1lido",familias:[{nombre:"trato agradable",entradas:[{p:"Amable",d:"trato considerado y educado por norma.",v:"da las gracias al repartidor por su nombre."},{p:"Cordial",d:"cercano y c\xE1lido en el trato, sin llegar a la intimidad.",v:"te recibe con una sonrisa real aunque apenas os conozc\xE1is."},{p:"Afable",d:"agradable y f\xE1cil de tratar; da gusto hablar con \xE9l.",v:"la conversaci\xF3n fluye sin esfuerzo desde el primer minuto."},{p:"Afectuoso",d:"muestra cari\xF1o de forma habitual.",v:"pregunta por tu madre y se acuerda de c\xF3mo se llama."},{p:"Accesible",d:"se deja abordar, no pone barreras de rango.",v:"le puedes interrumpir sin miedo aunque est\xE9 ocupado."},{p:"Llano",d:"sin pretensiones ni f\xF3rmulas; trata a todos igual.",v:"habla igual con un cliente que con un pe\xF3n."}]},{nombre:"sensibilidad al otro",entradas:[{p:"Emp\xE1tico",d:"capta lo que el otro siente. Es una capacidad, no una virtud: los manipuladores h\xE1biles la tienen alta.",v:"nota que est\xE1s mal antes de que lo digas."},{p:"Compasivo",d:"se conmueve con el mal ajeno y quiere aliviarlo. Aqu\xED s\xED hay virtud: empat\xEDa **m\xE1s** intenci\xF3n de ayudar.",v:"se para a ayudar aunque le cueste llegar tarde."},{p:"Considerado",d:"piensa en el efecto que sus actos tienen sobre ti.",v:"no llama a las once de la noche porque sabe que madrugas."},{p:"Atento",d:"se anticipa a lo que necesitas.",v:"aparece con el caf\xE9 como lo tomas sin haberlo pedido."},{p:"Sol\xEDcito",d:"se ofrece con prontitud, a veces m\xE1s de la cuenta.",v:"se levanta a ayudar antes de que nadie lo pida."}]},{nombre:"dar",entradas:[{p:"Generoso",d:"da con facilidad tiempo, dinero o atenci\xF3n.",v:"te deja la furgoneta el fin de semana sin preguntar para qu\xE9."},{p:"Desprendido",d:"no se aferra a lo material.",v:"regala la herramienta que le sobra en vez de guardarla por si acaso."},{p:"Altruista",d:"act\xFAa en beneficio ajeno sin esperar retorno.",v:"dedica los s\xE1bados a algo que no le da nada a cambio."},{p:"Magn\xE1nimo",d:"grandeza de \xE1nimo: perdona, no se cobra las deudas, no se rebaja a la peque\xF1ez.",v:"pudiendo humillar al que se equivoc\xF3, le quita hierro delante de todos."}]},{nombre:"ceder (con su exceso)",entradas:[{p:"Conciliador",d:"busca el punto de acuerdo entre posturas.",v:"reformula lo que dice cada uno hasta que ambos se reconocen."},{p:"Transigente",d:"cede en lo suyo para que la cosa avance.",v:"acepta el sitio que no le gusta para no alargar el debate."},{p:"Indulgente",d:"perdona faltas con facilidad.",v:"le fallas y a la semana siguiente ya est\xE1 resuelto."},{p:"Complaciente",d:"cede por agradar, no por convicci\xF3n. Aqu\xED empieza el exceso.",v:"dice que s\xED a todo y luego no puede con la carga."},{p:"Sumiso",d:"se pliega sistem\xE1ticamente a la voluntad ajena.",v:'nunca sabes qu\xE9 prefiere porque siempre dice "lo que t\xFA veas".'},{p:"Servil",d:"se pliega **y adem\xE1s** se rebaja, buscando el favor del otro.",v:"cambia de tono y de postura corporal cuando entra el jefe."},{p:"Pusil\xE1nime",d:'literalmente "de \xE1nimo peque\xF1o": le falta arrojo para sostener lo suyo.',v:"sabe que tiene raz\xF3n y calla por no discutir."},{p:"Apocado",d:"se achica ante los dem\xE1s; pierde presencia en cuanto hay alguien de m\xE1s car\xE1cter.",v:"baja la voz y se retira de la conversaci\xF3n cuando entra el que manda."}]}]},{nombre:"Polo \xE1spero",familias:[{nombre:"frialdad en el trato",entradas:[{p:"Seco",d:"trata sin adorno ni calidez. No implica mala intenci\xF3n.",v:"contesta lo justo y se da la vuelta."},{p:"Adusto",d:"serio y severo en el gesto y en el trato.",v:"nunca le has visto la cara relajada."},{p:"Brusco",d:"corta y responde de golpe, sin modular.",v:'te interrumpe con un "no" seco y sigue a lo suyo.'},{p:"Cortante",d:"zanja la conversaci\xF3n de forma tajante.",v:"una frase suya deja la mesa en silencio."},{p:"Desabrido",d:"trato desagradable, sin gracia, que deja mal sabor.",v:"sales de hablar con \xE9l molesto sin saber exactamente por qu\xE9."},{p:"Displicente",d:"te trata con desgana, como si atenderte le supusiera un esfuerzo.",v:"responde sin levantar la vista del m\xF3vil."},{p:"Despectivo",d:"trata con desprecio abierto.",v:'se refiere a tu trabajo como "eso que haces t\xFA".'},{p:"Fr\xEDo",d:"no conecta emocionalmente, ni da ni pide.",v:"le cuentas una desgracia y pasa al siguiente tema."},{p:"Indiferente",d:"le da igual lo que te pase.",v:"no pregunta ni una vez c\xF3mo sali\xF3 aquello que te preocupaba."},{p:"Insensible",d:"no registra el da\xF1o que causa o que ve.",v:"hace el chiste justo delante de la persona a la que le duele."},{p:"Desconsiderado",d:"no tiene en cuenta el efecto de sus actos sobre los dem\xE1s.",v:"aparca donde te bloquea la salida porque le ven\xEDa bien."}]},{nombre:"irritabilidad y hostilidad",entradas:[{p:"Irritable",d:"salta con facilidad ante lo peque\xF1o.",v:"un sem\xE1foro le arruina la ma\xF1ana."},{p:"Susceptible",d:"se ofende con facilidad y lee ataque donde no lo hay.",v:"le comentas algo neutro y responde a la defensiva."},{p:"Quisquilloso",d:"se molesta por detalles nimios y los saca a relucir.",v:"dedica diez minutos a que le pusieron la servilleta mal doblada."},{p:"Iracundo",d:"propenso a la ira intensa.",v:"pasa de cero a gritos en un segundo."},{p:"Hostil",d:"su disposici\xF3n de fondo hacia los dem\xE1s es de enemistad.",v:"interpreta cualquier propuesta ajena como una maniobra en su contra."},{p:"Belicoso",d:"busca activamente la pelea.",v:"entra en discusiones que no van con \xE9l."},{p:"Ciza\xF1ero",d:"siembra discordia entre otros.",v:"le cuenta a cada uno lo que dijo el otro, con retoques."},{p:"Rencoroso",d:"guarda la ofensa mucho tiempo.",v:"saca en una discusi\xF3n algo que pas\xF3 hace seis a\xF1os."},{p:"Vengativo",d:"adem\xE1s de guardarla, se la cobra.",v:"espera el momento y te deja tirado justo cuando le necesitas."},{p:"Resentido",d:"arrastra un agravio general contra la vida o contra un grupo.",v:"atribuye todo \xE9xito ajeno a un enchufe o a una trampa."}]},{nombre:"cr\xEDtica hiriente",entradas:[{p:"Critic\xF3n",d:"encuentra el defecto de todo.",v:"en cualquier restaurante hay algo que est\xE1 mal."},{p:"Mordaz",d:"critica con ingenio y hace da\xF1o. La gracia es parte del filo.",v:"suelta una frase que hace re\xEDr a todos menos a uno."},{p:"Sarc\xE1stico",d:"dice lo contrario de lo que quiere decir para herir.",v:'aplaude despacio y dice "qu\xE9 bien lo has hecho".'},{p:"Ir\xF3nico",d:"dice lo contrario de lo que quiere decir, sin intenci\xF3n de herir. La iron\xEDa es un recurso; el sarcasmo es un arma.",v:'comenta "menudo veranito" en pleno diluvio.'},{p:"C\xE1ustico",d:"su cr\xEDtica corroe, va contra la persona y no contra la obra.",v:"no critica tu idea, critica que se te haya ocurrido a ti."},{p:"Falt\xF3n",d:"cruza la l\xEDnea del respeto con facilidad.",v:"en cuanto se calienta, la discusi\xF3n pasa a lo personal."}]}]}]},{n:3,titulo:"Orden y voluntad",intro:"Si se puede contar con esa persona: si hace lo que dice, cu\xE1ndo lo hace y con qu\xE9 cuidado. Es la dimensi\xF3n que mejor predice el rendimiento en el trabajo y la salud de una convivencia.",polos:[{nombre:"Polo met\xF3dico",familias:[{nombre:"fiabilidad",entradas:[{p:"Responsable",d:"responde por lo que hace y por lo que le corresponde.",v:"asume el error sin buscar a qui\xE9n repart\xEDrselo."},{p:"Cumplidor",d:"hace lo que dice que va a hacer.",v:"dijo el jueves y estaba el jueves."},{p:"Fiable",d:"puedes construir sobre lo que promete.",v:"le delegas algo importante y dejas de pensar en ello."},{p:"Formal",d:"cumple lo pactado y guarda las formas del compromiso.",v:"avisa con antelaci\xF3n cuando no va a poder."},{p:"Puntual",d:"llega a la hora. Parece menor y es la se\xF1al barata m\xE1s informativa que existe.",v:"est\xE1 en la puerta cinco minutos antes."}]},{nombre:"orden y cuidado",entradas:[{p:"Organizado",d:"tiene un sistema y lo mantiene.",v:"encuentra el papel de hace dos a\xF1os en treinta segundos."},{p:"Met\xF3dico",d:"sigue siempre el mismo procedimiento para lo mismo.",v:"recoge las herramientas en el mismo orden todos los d\xEDas."},{p:"Sistem\xE1tico",d:"aborda las cosas por partes y sin saltarse pasos.",v:"antes de tocar nada, comprueba lo que ya ha comprobado mil veces."},{p:"Meticuloso",d:"atiende al detalle peque\xF1o.",v:"repasa el remate que nadie va a ver."},{p:"Minucioso",d:"meticuloso **y** exhaustivo: no deja nada fuera.",v:"entrega el informe con los ocho casos, no con los tres importantes."},{p:"Escrupuloso",d:"cuidado extremo, con un componente de conciencia moral: no se permite hacerlo regular.",v:"rehace un trabajo ya cobrado porque no le convence."},{p:"Pulcro",d:"limpio y cuidado en la forma y en la presentaci\xF3n.",v:"su furgoneta y sus cajas est\xE1n igual de ordenadas que su casa."}]},{nombre:"voluntad sostenida",entradas:[{p:"Disciplinado",d:"hace lo que toca aunque no le apetezca.",v:"mantiene la rutina tambi\xE9n en las semanas malas."},{p:"Constante",d:"sostiene el esfuerzo en el tiempo.",v:"lleva cuatro a\xF1os haciendo lo mismo sin bajar el ritmo."},{p:"Tenaz",d:"no suelta la presa aunque la cosa se ponga dif\xEDcil.",v:"lleva tres d\xEDas con la misma aver\xEDa y sigue midiendo."},{p:"Perseverante",d:"insiste tras el fracaso.",v:"le dicen que no y vuelve con otra propuesta."},{p:"Diligente",d:"hace las cosas con prontitud **y** con cuidado. Las dos a la vez.",v:"pides algo y est\xE1 hecho esa misma tarde, y bien."},{p:"Aplicado",d:"se esfuerza en aprender y en hacerlo bien.",v:"se estudia el manual del equipo nuevo antes de que llegue."},{p:"Previsor",d:"se adelanta a lo que puede pasar.",v:"lleva el recambio que casi nunca hace falta."},{p:"Prudente",d:"mide el riesgo antes de actuar.",v:"no toca el cuadro sin comprobar dos veces que no hay tensi\xF3n."},{p:"Cauto",d:"act\xFAa con reserva, no se expone.",v:"no da su opini\xF3n hasta saber qui\xE9n hay en la sala."}]},{nombre:"el exceso de orden",entradas:[{p:"Perfeccionista",d:"no da nada por bueno hasta que es impecable.",v:"la entrega se retrasa por detalles que nadie ha pedido."},{p:"Puntilloso",d:"se detiene en detalles menores y los convierte en asunto.",v:"corrige una coma en un mensaje de WhatsApp."},{p:"R\xEDgido",d:"no adapta el procedimiento aunque la situaci\xF3n haya cambiado.",v:"sigue el protocolo cuando el protocolo ya no sirve."},{p:"Cuadriculado",d:"solo concibe una manera de hacer las cosas.",v:'rechaza una soluci\xF3n mejor porque "no es como se hace".'},{p:"Mani\xE1tico",d:"tiene fijaciones concretas e innegociables.",v:"no puede empezar si la mesa no est\xE1 exactamente as\xED."}]}]},{nombre:"Polo descuidado",familias:[{nombre:"General",entradas:[{p:"Desorganizado",d:"no tiene sistema.",v:"pierde veinte minutos cada ma\xF1ana buscando algo."},{p:"Ca\xF3tico",d:"su desorden le desborda y salpica a los dem\xE1s.",v:"su desorden te obliga a ti a rehacer cosas."},{p:"Disperso",d:"empieza muchas cosas y salta de una a otra.",v:"tiene cinco tareas abiertas y ninguna cerrada."},{p:"Descuidado",d:"no pone atenci\xF3n en lo que hace.",v:"deja el trabajo bien hecho por dentro y hecho un desastre por fuera."},{p:"Negligente",d:"su descuido causa da\xF1o real. Es la versi\xF3n con consecuencias.",v:"no revisa lo que sabe que hay que revisar y alguien lo paga."},{p:"Chapucero",d:'hace las cosas r\xE1pido y mal, dej\xE1ndolas "que aguanten".',v:"la soluci\xF3n dura tres semanas y luego hay que volver."},{p:"Dejado",d:"abandona el cuidado de lo suyo (trabajo, casa, aspecto).",v:"lo que se estropea se queda estropeado."},{p:"Informal",d:"no cumple lo que dice ni avisa.",v:"qued\xE1is y desaparece sin mensaje."},{p:"Inconstante",d:"arranca con fuerza y abandona.",v:"lleva ocho aficiones empezadas y ninguna a medio camino."},{p:"Voluble",d:"cambia de criterio o de \xE1nimo con facilidad.",v:"lo que hoy es prioridad absoluta, el lunes ni se menciona."},{p:"Perezoso",d:"evita el esfuerzo.",v:"siempre encuentra el modo de que lo haga otro."},{p:"Indolente",d:"ni se esfuerza ni le importa no esforzarse. A\xF1ade indiferencia a la pereza.",v:"le dices que va a salir mal y se encoge de hombros."},{p:"Ap\xE1tico",d:"no le mueve nada, ni siquiera lo suyo.",v:"le ofreces algo que le gustaba y le da igual."},{p:"Acomodado",d:"se instala en lo c\xF3modo y no sale de ah\xED.",v:"rechaza una oportunidad clara por no cambiar de rutina."},{p:"Impulsivo",d:"act\xFAa antes de pensar.",v:"compra, contesta o dimite en caliente."},{p:"Irreflexivo",d:"no valora las consecuencias.",v:"dice lo primero que le pasa por la cabeza delante de quien no debe."},{p:"Atolondrado",d:"se l\xEDa, se precipita y se equivoca por atropello.",v:"sale de casa sin las llaves tres veces por semana."},{p:"Fr\xEDvolo",d:"no da peso a lo que lo tiene.",v:"se toma a broma el problema serio de otro."}]}]}]},{n:4,titulo:"Temple emocional",intro:"C\xF3mo reacciona por dentro cuando las cosas se tuercen: con qu\xE9 facilidad se altera, cu\xE1nto tarda en volver a su sitio y qu\xE9 hace mientras tanto. Es la dimensi\xF3n que m\xE1s sufre la gente que convive con ella y la que menos se ve en una primera impresi\xF3n.",polos:[{nombre:"Polo sereno",familias:[{nombre:"General",entradas:[{p:"Sereno",d:"mantiene la calma cuando la situaci\xF3n se complica.",v:"salta la alarma y \xE9l baja el tono en vez de subirlo."},{p:"Templado",d:"tiene la emoci\xF3n bajo control sin reprimirla; ni fr\xEDo ni desbordado.",v:"se enfada de verdad y aun as\xED se le entiende todo lo que dice."},{p:"Ecu\xE1nime",d:"mantiene el mismo criterio le afecte a \xE9l o a otro.",v:"juzga igual el error de su amigo que el del que le cae mal."},{p:"Imperturbable",d:"nada le altera visiblemente.",v:"le dan la peor noticia del a\xF1o y sigue con el mismo pulso."},{p:"Flem\xE1tico",d:"lento en alterarse, de reacci\xF3n pausada por temperamento.",v:"todos corriendo y \xE9l a su ritmo, y llega igual."},{p:"Estoico",d:"aguanta el dolor y la adversidad sin quejarse.",v:"lleva dos meses con un problema serio y te enteras por otro."},{p:"Sosegado",d:"vive a un ritmo interior tranquilo.",v:"nunca tiene prisa aunque vaya justo."},{p:"Apacible",d:"de trato y de humor suaves, transmite calma.",v:"estar con \xE9l te baja las pulsaciones."},{p:"Resiliente",d:"se recupera del golpe y sigue.",v:"pierde el trabajo y a las dos semanas ya est\xE1 en otra cosa."},{p:"Entero",d:"no se rompe delante del problema.",v:"organiza el funeral de su padre sin venirse abajo."},{p:"Curtido",d:"se ha endurecido por experiencia acumulada, no por car\xE1cter.",v:"lo que a los dem\xE1s les parece una crisis, \xE9l ya lo ha visto tres veces."},{p:"Aplomado",d:"tiene seguridad de porte: se le nota firme y asentado.",v:"habla delante de cincuenta personas sin que le tiemble la voz."},{p:"Seguro de s\xED",d:"conf\xEDa en su propio criterio.",v:"sostiene su decisi\xF3n aunque nadie m\xE1s la comparta."}]}]},{nombre:"Polo inestable",familias:[{nombre:"ansiedad",entradas:[{p:"Ansioso",d:"anticipa continuamente lo que puede salir mal.",v:"pregunta cinco veces por algo que ya est\xE1 resuelto."},{p:"Aprensivo",d:"teme males concretos, sobre todo da\xF1os y enfermedades.",v:"cualquier molestia f\xEDsica le parece el principio de algo grave."},{p:"Inquieto",d:"no puede parar, ni de cuerpo ni de cabeza.",v:"no aguanta sentado toda una comida."},{p:"Nervioso",d:"reacciona con tensi\xF3n ante cualquier est\xEDmulo.",v:"se le nota en las manos antes de una reuni\xF3n rutinaria."},{p:"Tenso",d:"vive con el cuerpo y el trato agarrotados.",v:"le cuesta re\xEDrse aunque quiera."}]},{nombre:"inseguridad",entradas:[{p:"Inseguro",d:"duda de su propio valor y de su criterio.",v:"te pide opini\xF3n sobre algo que domina mejor que t\xFA."},{p:"Indeciso",d:"no consigue elegir.",v:"lleva ocho meses con la misma decisi\xF3n encima de la mesa."},{p:"Dubitativo",d:"se lo replantea todo mientras lo dice.",v:"cambia de postura tres veces en la misma frase."},{p:"Vacilante",d:"arranca la acci\xF3n y se echa atr\xE1s.",v:"dice que s\xED, y a la hora escribe para matizarlo."},{p:"Fr\xE1gil",d:"se rompe con poco.",v:"una cr\xEDtica menor le deja fuera de juego el resto del d\xEDa."}]},{nombre:"descontrol",entradas:[{p:"Irascible",d:"se enciende r\xE1pido y fuerte.",v:"la discusi\xF3n pasa a gritos en menos de un minuto."},{p:"Explosivo",d:"acumula en silencio y estalla de golpe.",v:"aguanta tres semanas y revienta por una tonter\xEDa."},{p:"Temperamental",d:"su humor manda sobre su conducta.",v:"el trato que te da depende de c\xF3mo se haya levantado."},{p:"Vol\xE1til",d:"cambia de estado emocional sin transici\xF3n.",v:"pasa de la euforia al desplome en la misma tarde."},{p:"Visceral",d:"reacciona desde la tripa, sin pasar por la cabeza.",v:"responde al mensaje antes de acabar de leerlo."}]},{nombre:"fondo sombr\xEDo",entradas:[{p:"Melanc\xF3lico",d:"tiene un fondo triste estable, sin causa actual.",v:"est\xE1 bien y aun as\xED hay algo apagado debajo."},{p:"Pesimista",d:"espera por defecto que salga mal.",v:"ante cualquier plan, su primera frase es el inconveniente."},{p:"Derrotista",d:"da por perdido antes de intentarlo.",v:'ni presenta la oferta porque "total, no nos la van a dar".'},{p:"Agorero",d:"anuncia desgracias.",v:"siempre tiene el caso de alguien a quien le fue fatal."},{p:"Victimista",d:"se coloca sistem\xE1ticamente en el papel de perjudicado.",v:"cualquier problema acaba siendo algo que le han hecho a \xE9l."}]},{nombre:"desconfianza",entradas:[{p:"Receloso",d:"desconf\xEDa sin motivo declarado.",v:"te pregunta tres veces lo mismo con otras palabras."},{p:"Suspicaz",d:"busca activamente la segunda intenci\xF3n en lo que dices.",v:'le haces un cumplido y responde "\xBFpor qu\xE9 me dices eso?".'},{p:"Desconfiado",d:"parte de la base de que la gente falla.",v:"nunca delega nada de verdad."},{p:"Celoso",d:"teme perder a alguien frente a un tercero.",v:"le cambia la cara cuando aparece cierta persona."},{p:"Posesivo",d:"trata el v\xEDnculo como propiedad.",v:"le molesta el plan al que no est\xE1 invitado."}]}]}]},{n:5,titulo:"Mente y curiosidad",intro:"C\xF3mo funciona su cabeza: qu\xE9 le interesa, c\xF3mo procesa lo nuevo y cu\xE1nta realidad admite que no encaja con lo que ya cree. Ojo: **esta dimensi\xF3n no mide inteligencia**. Hay gente muy lista y muy cerrada, y gente de capacidad normal y muy abierta.",polos:[{nombre:"Polo abierto",familias:[{nombre:"curiosidad",entradas:[{p:"Curioso",d:"quiere saber c\xF3mo funcionan las cosas.",v:"desmonta el aparato averiado aunque ya haya comprado el nuevo."},{p:"Inquieto (intelectualmente)",d:"no se conforma con lo que ya sabe.",v:"se mete en un tema nuevo cada pocos meses."},{p:"\xC1vido",d:"devora informaci\xF3n con hambre.",v:"se lee la documentaci\xF3n entera, no el resumen."}]},{nombre:"agudeza",entradas:[{p:"Agudo",d:"capta r\xE1pido, incluso lo que se dice a medias.",v:"entiende el problema antes de que acabes de explicarlo."},{p:"Perspicaz",d:"ve lo que otros no ven, no lo que otros ven m\xE1s lento.",v:"se\xF1ala el detalle que a todos se les hab\xEDa pasado."},{p:"Sagaz",d:"perspicaz **y** pr\xE1ctico: usa lo que ve para anticiparse.",v:"prev\xE9 la maniobra del otro antes de que la haga."},{p:"L\xFAcido",d:"ve la situaci\xF3n con claridad, sin enga\xF1arse.",v:"es el \xFAnico que nombra en voz alta lo que todos evitan."},{p:"Ingenioso",d:"encuentra soluciones o salidas originales.",v:"resuelve con lo que tiene a mano algo que requer\xEDa material."},{p:"Ocurrente",d:"se le ocurren cosas con gracia y rapidez.",v:"tiene siempre la r\xE9plica justa en el momento justo."},{p:"Reflexivo",d:"piensa las cosas antes de opinar.",v:"pide un d\xEDa antes de contestar a algo importante."},{p:"Anal\xEDtico",d:"descompone los problemas en partes.",v:"antes de responder, ordena en voz alta las variables."}]},{nombre:"cultivo y estilo",entradas:[{p:"Culto",d:"tiene conocimiento amplio y lo ha integrado.",v:"relaciona lo que est\xE1s contando con algo de otro campo."},{p:"Erudito",d:"sabe much\xEDsimo de un terreno concreto.",v:"conoce la excepci\xF3n de la excepci\xF3n."},{p:"Versado",d:"tiene pr\xE1ctica y conocimiento en una materia.",v:"se maneja en el asunto sin necesitar consultar."},{p:"Inconformista",d:"no acepta lo establecido por el hecho de estar establecido.",v:'pregunta "\xBFy por qu\xE9 se hace as\xED?" en su primer d\xEDa.'},{p:"Heterodoxo",d:"se aparta de la doctrina aceptada por convicci\xF3n propia, no por rebeld\xEDa.",v:"defiende en p\xFAblico el m\xE9todo que su gremio da por descartado."},{p:"Original",d:"piensa por su cuenta y llega a sitios propios.",v:"su propuesta no se parece a ninguna de las de la sala."},{p:"Exc\xE9ntrico",d:"se sale de la norma en sus gustos o costumbres, sin buscarlo.",v:"le da igual que le miren raro y ni se ha dado cuenta."},{p:"Refinado",d:"tiene el gusto educado y distingue matices.",v:"nota la diferencia donde los dem\xE1s vemos lo mismo."}]}]},{nombre:"Polo cerrado",familias:[{nombre:"General",entradas:[{p:"Convencional",d:"se mueve por lo aceptado y no lo cuestiona.",v:'su respuesta a por qu\xE9 es "porque siempre se ha hecho as\xED".'},{p:"Rutinario",d:"vive en lo repetido y evita lo nuevo.",v:"lleva doce a\xF1os pidiendo el mismo plato en el mismo sitio."},{p:"Prosaico",d:"solo valora lo pr\xE1ctico e inmediato.",v:"lo que no tiene utilidad directa le parece una tonter\xEDa."},{p:"Dogm\xE1tico",d:"sus opiniones no admiten revisi\xF3n: son verdades.",v:'no dice "yo creo", dice "es as\xED".'},{p:"Intransigente",d:"no cede ni un mil\xEDmetro ante otra postura.",v:"rechaza el punto intermedio aunque le beneficie."},{p:"Obcecado",d:"se ha cerrado en una idea y ya no procesa nada que la contradiga.",v:"le ense\xF1as la prueba y busca por qu\xE9 la prueba est\xE1 mal."},{p:"Cerril",d:"cerrado por bruto, no por convicci\xF3n.",v:"ni siquiera escucha el argumento entero."},{p:"Obtuso",d:"no llega a entender, por lentitud o por estrechez.",v:"se lo has explicado de cuatro maneras y sigue en la primera."},{p:"Sectario",d:"solo admite lo que viene de los suyos.",v:"el mismo argumento le vale o no seg\xFAn qui\xE9n lo diga."},{p:"Prejuicioso",d:"juzga por la categor\xEDa, no por la persona.",v:"ya sabe c\xF3mo es alguien antes de cruzar una palabra."},{p:"Cr\xE9dulo",d:"se cree lo que le cuentan sin filtrar.",v:"reenv\xEDa cualquier cosa que le llega."},{p:"Ingenuo",d:"no ve la malicia ajena. **No es tonto**: es que no la busca.",v:"le enga\xF1an y sigue pensando que fue un malentendido."},{p:"C\xE1ndido",d:"ingenuo con un punto de pureza; ni concibe el enga\xF1o.",v:"se sorprende sinceramente de que alguien mienta."}]}]}]},{n:6,titulo:"Honestidad y ego",intro:"Si va de frente o va a lo suyo, y cu\xE1nto sitio ocupa su propia imagen. Es la dimensi\xF3n decisiva: puedes convivir con alguien desordenado, t\xEDmido o nervioso, pero no con alguien de quien no te f\xEDas. Tambi\xE9n es donde m\xE1s se falla al elegir la palabra, porque hay quince t\xE9rminos parecidos y cada uno significa algo distinto.",polos:[{nombre:"Polo \xEDntegro",familias:[{nombre:"fondo moral",entradas:[{p:"\xCDntegro",d:"sus actos coinciden con lo que dice creer, tambi\xE9n cuando nadie mira.",v:"devuelve el dinero de m\xE1s sin que nadie lo hubiera notado."},{p:"Honrado",d:"no toma lo que no le corresponde.",v:"factura las horas que ha hecho, no las que podr\xEDa colar."},{p:"Recto",d:"no se desv\xEDa de lo que considera correcto, ni por presi\xF3n ni por inter\xE9s.",v:"pierde el cliente antes que firmar algo que no se ajusta a norma."},{p:"Cabal",d:"persona completa y de juicio sensato; de una pieza.",v:"todo el mundo que le conoce dice exactamente lo mismo de \xE9l."},{p:"Decente",d:"cumple lo m\xEDnimo que se le debe a los dem\xE1s.",v:"avisa al vecino antes de empezar la obra."},{p:"Justo",d:"da a cada uno lo suyo.",v:"reparte el m\xE9rito incluyendo al que no estaba delante."},{p:"Leal",d:"sostiene el v\xEDnculo cuando cuesta.",v:"no se apunta a criticarte cuando no est\xE1s."}]},{nombre:"transparencia",entradas:[{p:"Sincero",d:"dice lo que piensa.",v:"responde a lo que le has preguntado de verdad."},{p:"Franco",d:"dice lo que piensa **aunque incomode**.",v:"te dice que la idea no es buena delante de todos."},{p:"Directo",d:"va al asunto sin rodeos.",v:"la conversaci\xF3n dura tres minutos y queda todo claro."},{p:"Transparente",d:"no oculta ni sus intenciones ni sus intereses.",v:"dice de entrada qu\xE9 gana \xE9l con esto."}]},{nombre:"humildad",entradas:[{p:"Humilde",d:"conoce su valor y no necesita exhibirlo.",v:"sabe m\xE1s que nadie en la sala y deja hablar a los dem\xE1s."},{p:"Modesto",d:"quita importancia a sus propios m\xE9ritos.",v:"le felicitan y desv\xEDa el m\xE9rito al equipo, y es verdad."},{p:"Sencillo",d:"no se rodea de aparato ni de distancia.",v:"tiene un cargo importante y no lo mencionar\xEDa jam\xE1s."},{p:"Autocr\xEDtico",d:"se examina a s\xED mismo con el mismo rasero que a los dem\xE1s.",v:"es el primero en decir en qu\xE9 se equivoc\xF3."},{p:"Agradecido",d:"reconoce lo que recibe.",v:"se acuerda un a\xF1o despu\xE9s del favor que le hiciste."},{p:"Desinteresado",d:"act\xFAa sin buscar retorno.",v:"ayuda igual al que nunca podr\xE1 devolv\xE9rselo."}]}]},{nombre:"Polo interesado",familias:[{nombre:"el ego (el grupo m\xE1s confundido de toda la gu\xEDa)",entradas:[{p:"Soberbio",d:"se sobrevalora a s\xED mismo. El foco est\xE1 en c\xF3mo se ve por dentro.",v:"no admite un error ni con la prueba delante."},{p:"Arrogante",d:"exige el trato que cree merecer. El foco est\xE1 en lo que reclama.",v:"se molesta porque no le han consultado a \xE9l primero."},{p:"Altivo",d:"marca distancia hacia abajo. El foco est\xE1 en la separaci\xF3n.",v:"no se sienta en esa mesa."},{p:"Altanero",d:"mira por encima del hombro; altivo con desd\xE9n visible.",v:"te contesta sin girar del todo la cabeza."},{p:"Engre\xEDdo",d:"se recrea en s\xED mismo, encantado de conocerse.",v:"cuenta la misma an\xE9cdota suya por tercera vez."},{p:"Vanidoso",d:"necesita ser admirado, sobre todo por su imagen.",v:"mira si le has visto hacer lo que acaba de hacer."},{p:"Presuntuoso",d:"presume de lo que tiene o cree tener.",v:"mete el precio de las cosas en la conversaci\xF3n."},{p:"Fanfarr\xF3n",d:"exagera o inventa m\xE9ritos para impresionar.",v:"todas sus an\xE9cdotas acaban con \xE9l quedando por encima."},{p:"Petulante",d:"exhibe con afectaci\xF3n y sin venir a cuento.",v:"suelta el dato culto que no aporta nada al tema."},{p:"Pedante",d:"exhibe espec\xEDficamente **saber**, para marcar nivel.",v:"corrige tu terminolog\xEDa en vez de responder a tu pregunta."},{p:"Prepotente",d:"impone porque cree que puede.",v:'zanja con "esto se hace as\xED y punto".'},{p:"Condescendiente",d:"te trata como inferior **siendo amable**. Ah\xED est\xE1 el veneno: la forma es correcta y el fondo te rebaja.",v:'dice "claro, t\xFA no tienes por qu\xE9 saberlo" con buen tono.'},{p:"Paternalista",d:"decide por tu bien sin pedirte permiso.",v:'te oculta informaci\xF3n "para no preocuparte".'},{p:"Egoc\xE9ntrico",d:"todo lo refiere a s\xED mismo.",v:"le cuentas un problema tuyo y acaba hablando del suyo."},{p:"Eg\xF3latra",d:"se adora abiertamente.",v:"su conversaci\xF3n entera es su propia biograf\xEDa."},{p:"Narcisista",d:"necesita admiraci\xF3n constante, se cree con derechos especiales y no registra el da\xF1o que hace. Es un **t\xE9rmino cl\xEDnico**: \xFAsalo para el patr\xF3n completo y estable, no como sin\xF3nimo elegante de ego\xEDsta.",v:"el patr\xF3n se repite durante a\xF1os, en todos sus v\xEDnculos, y siempre acaba con el otro pidiendo perd\xF3n."}]},{nombre:"el inter\xE9s",entradas:[{p:"Ego\xEDsta",d:"antepone lo suyo.",v:"reparte de forma que a \xE9l le toque lo mejor, siempre."},{p:"Interesado",d:"se acerca en funci\xF3n de lo que puede sacar.",v:"aparece justo cuando necesita algo y desaparece despu\xE9s."},{p:"Utilitario",d:"trata a las personas como medios.",v:"clasifica a la gente por lo que le pueden resolver."},{p:"Mercenario",d:"solo se implica mientras cobra, y el cobro puede ser afectivo y no material.",v:"su inter\xE9s se apaga el d\xEDa exacto en que deja de recibir."},{p:"Oportunista",d:"aprovecha la coyuntura sin compromiso previo.",v:"se arrima al proyecto justo cuando empieza a salir bien."},{p:"Ventajista",d:"busca sacar m\xE1s de lo que aporta.",v:"siempre pone la parte m\xE1s peque\xF1a y cobra la m\xE1s grande."},{p:"Aprovechado",d:"se instala en el esfuerzo ajeno.",v:"nunca le toca pagar y siempre hay un motivo."},{p:"Arribista",d:"trepa socialmente sin escr\xFApulos sobre los medios.",v:"cambia de amistades cada vez que sube de puesto."},{p:"Calculador",d:"mide constantemente coste y beneficio de cada relaci\xF3n.",v:"su simpat\xEDa sube y baja seg\xFAn qui\xE9n est\xE9 delante."},{p:"Transaccional",d:"entiende los v\xEDnculos como un intercambio con marcador.",v:"te recuerda lo que hizo por ti cuando quiere algo."},{p:"Mezquino",d:"ruin en lo que da y en lo que reconoce. No es solo taca\xF1o: es peque\xF1o de esp\xEDritu.",v:"le regatea el m\xE9rito a alguien que se lo ha ganado."},{p:"Codicioso",d:"quiere m\xE1s, siempre.",v:"gana lo que quer\xEDa y al d\xEDa siguiente ya quer\xEDa otra cosa."},{p:"Taca\xF1o",d:"le duele gastar.",v:"calcula al c\xE9ntimo su parte de la cuenta."},{p:"Ingrato",d:"no reconoce lo recibido.",v:"le sacas de un apuro y a la semana ni se menciona."}]},{nombre:"el enga\xF1o",entradas:[{p:"Mentiroso",d:"falta a la verdad.",v:"dos versiones suyas no encajan y no le importa."},{p:"Embustero",d:"miente por costumbre, incluso sin necesidad.",v:"miente en cosas que no le aportan nada."},{p:"Falso",d:"muestra un afecto que no tiene.",v:"te trata de maravilla y luego te destroza en cuanto sales."},{p:"Hip\xF3crita",d:"exige a los dem\xE1s lo que \xE9l no cumple.",v:"critica exactamente lo que hizo el mes pasado."},{p:"Farsante",d:"sostiene un personaje entero que no es \xE9l.",v:"descubres que su curr\xEDculum no era ni parecido."},{p:"C\xEDnico",d:"hace o dice lo indebido **sin ocultarlo y sin verg\xFCenza**.",v:"reconoce abiertamente que le da igual y se queda tan tranquilo."},{p:"Desvergonzado",d:"act\xFAa mal sin pudor y sin molestarse en disimular.",v:"le pillan en falta y se r\xEDe."},{p:"Adulador",d:"halaga para obtener algo.",v:"sus elogios llegan siempre unos minutos antes de la petici\xF3n."},{p:"Zalamero",d:"halaga con empalago y familiaridad excesiva.",v:'te toca el hombro y te llama "campe\xF3n".'},{p:"Manipulador",d:"orienta a otros hacia lo que \xE9l quiere sin que lo vean.",v:"acabas haciendo algo que no quer\xEDas y no sabes en qu\xE9 momento decidiste."},{p:"Taimado",d:"astuto y disimulado; esconde lo que trama.",v:"te enteras de sus movimientos cuando ya est\xE1n hechos."},{p:"Ladino",d:"astuto para su provecho, con un punto de bajeza.",v:"usa una cl\xE1usula que sab\xEDa que no hab\xEDas le\xEDdo."},{p:"Retorcido",d:"hace las cosas por caminos indirectos e innecesarios.",v:"pod\xEDa haberlo pedido y mont\xF3 una situaci\xF3n para conseguirlo."},{p:"Maquiav\xE9lico",d:"usa a las personas como piezas dentro de una estrategia fr\xEDa y sostenida.",v:"enfrenta a dos personas y se queda con el resultado de ambas."},{p:"Desleal",d:"rompe el v\xEDnculo cuando le conviene.",v:"cuenta lo que le confiaste a quien no deb\xEDa."}]}]}]},{n:7,titulo:"C\xF3mo se comporta en un conflicto",intro:"Una discusi\xF3n de veinte minutos ense\xF1a m\xE1s de una persona que seis meses de trato cordial. Aqu\xED no describimos un rasgo nuevo: describimos d\xF3nde se hacen visibles todos los anteriores.",polos:[{nombre:"Los cuatro estilos base",familias:[{nombre:"General",entradas:[{p:"Asertivo",d:"dice lo que quiere, con claridad, sin atacar al otro.",v:'dice "no me va bien y te propongo esto otro", sin subir el tono ni pedir perd\xF3n.'},{p:"Agresivo",d:"impone lo suyo pasando por encima del otro.",v:"sube la voz, interrumpe y personaliza."},{p:"Pasivo",d:"no dice lo que quiere y traga.",v:"acepta y luego se queja con un tercero."},{p:"Pasivo-agresivo",d:"no dice lo que quiere pero lo cobra por debajo.",v:'dice "t\xFA haz lo que quieras" y luego lo hace todo mal a prop\xF3sito, o con retraso, o en silencio durante tres d\xEDas.'}]}]},{nombre:"Polo dialogante",familias:[{nombre:"General",entradas:[{p:"Dialogante",d:"busca entender antes de responder.",v:"te repite tu argumento con sus palabras antes de rebatirlo."},{p:"Receptivo",d:"deja que le cambien de opini\xF3n.",v:'dice "no lo hab\xEDa visto as\xED" y de verdad se mueve.'},{p:"Conciliador",d:"busca el terreno com\xFAn.",v:"propone el punto en el que ambos gan\xE1is algo."},{p:"Ecu\xE1nime en la discusi\xF3n",d:"aplica el mismo criterio a su error y al tuyo.",v:"reconoce lo que le corresponde sin condicionarlo a que t\xFA reconozcas lo tuyo."},{p:"Vehemente",d:"defiende con pasi\xF3n e intensidad, pero argumentando.",v:"se le enciende la voz y aun as\xED todo lo que dice son razones."}]}]},{nombre:"Polo cerrado e :root{--bg:#14181d;--sur:#1c2229;--sur2:#242c35;--tx:#e8e4da;--tx2:#8a94a0;--amb:#e0a83c;--ok:#6fa87c;--bad:#c4685a;--brd:#313b46;--lcd:#0f1216}

.crx *{box-sizing:border-box}
.crx h1,.crx h2,.crx h3,.crx .serif{font-family:Georgia,'Noto Serif','Times New Roman',serif;font-weight:600;letter-spacing:.01em}

.crx .wrap{max-width:520px;margin:0 auto;padding:12px 14px 92px}
.crx .card{background:var(--sur);border:1px solid var(--brd);border-radius:10px;padding:14px;margin-bottom:12px}
.crx .card2{background:var(--sur2);border:1px solid var(--brd);border-radius:8px;padding:10px}

.crx textarea.fld{resize:vertical;min-height:60px}
.crx .chip{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;border:1px solid var(--brd);background:var(--sur2);color:var(--tx2);font-size:13.5px;margin:0 6px 6px 0;cursor:pointer;user-select:none}

.crx .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:9px;border:1px solid var(--brd);background:var(--sur2);color:var(--tx);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}

.crx .btn-sm{padding:6px 10px;font-size:13px;border-radius:7px}
.crx .btn:disabled{opacity:.45;cursor:default}
.crx .lcd{background:var(--lcd);border:1px solid #3a4450;border-radius:10px;padding:12px 14px;box-shadow:inset 0 0 18px rgba(224,168,60,.05)}

.crx .muted{color:var(--tx2);font-size:13px}
.crx .small{font-size:13px}
.crx .entry{border-left:3px solid var(--brd);padding:8px 10px;margin-bottom:8px;background:var(--sur2);border-radius:0 8px 8px 0}
